[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "constructionsight"
version = "0.1.0"
description = "Lawful public-record construction intelligence platform for California construction, planning, permit, CEQA, contractor, parcel, and agenda data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Tyler Alston" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "sqlalchemy>=2.0.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
constructionsight = "constructionsight.cli:app"
constructionsight-ceqanet-fixtures = "constructionsight.ceqanet_fixture_query_cli:app"
constructionsight-ceqanet-listing-plan = "constructionsight.ceqanet_listing_plan_cli:app"
constructionsight-ceqanet-listing-execute = "constructionsight.ceqanet_listing_execute_cli:app"
constructionsight-ceqanet-vocabulary = "constructionsight.ceqanet_vocabulary_export_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/constructionsight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
