[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "constructionsight"
version = "0.1.0"
description = "Lawful public-record construction intelligence platform for California construction, planning, permit, CEQA, contractor, parcel, and agenda data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Tyler Alston" }
]
dependencies = [
  "certifi==2025.6.15",
  "httpcore==1.0.9",
  "httpx[socks]==0.28.1",
  "pydantic==2.11.7",
  "typer==0.16.0",
  "rich==14.0.0",
  "sqlalchemy==2.0.41",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.12.4",
  "mypy==1.17.0",
]

[project.scripts]
constructionsight = "constructionsight.cli:app"
constructionsight-operator = "constructionsight.operator_web:main"
constructionsight-desktop = "constructionsight.operator_web:desktop_main"
constructionsight-intake = "constructionsight.intake_cli:app"
constructionsight-opportunity-intake = "constructionsight.opportunity_cli:app"
constructionsight-candidate-docket = "constructionsight.source_candidate_docket_cli:app"
constructionsight-external-intelligence = "constructionsight.external_intelligence_cli:app"
constructionsight-shovels-regrid-gaps = "constructionsight.external_gap_cli:app"
constructionsight-site-resolution = "constructionsight.site_resolution_cli:app"
constructionsight-parcel-sources = "constructionsight.parcel_source_cli:app"
constructionsight-storage-summary = "constructionsight.storage_summary_cli:app"
constructionsight-source-status = "constructionsight.source_status_cli:app"
constructionsight-source-readiness = "constructionsight.source_readiness_cli:app"
constructionsight-audit-package = "constructionsight.audit_package_cli:app"
constructionsight-source-checklist = "constructionsight.source_verification_checklist_cli:app"
constructionsight-source-promotion = "constructionsight.source_promotion_plan_cli:app"
constructionsight-source-plan = "constructionsight.source_registry_update_plan_cli:app"
constructionsight-leads = "constructionsight.lead_operator_cli:app"
constructionsight-results = "constructionsight.result_authority_cli:app"
constructionsight-upstream = "constructionsight.upstream_operator_cli:app"
constructionsight-certify = "constructionsight.repository_certification_v2:main"
constructionsight-supply-chain = "constructionsight.supply_chain:main"
constructionsight-ceqanet-fixtures = "constructionsight.ceqanet_fixture_query_cli:app"
constructionsight-ceqanet-listing-plan = "constructionsight.ceqanet_listing_plan_cli:app"
constructionsight-ceqanet-listing-execute = "constructionsight.ceqanet_listing_execute_cli:app"
constructionsight-ceqanet-recurring-run = "constructionsight.ceqanet_recurring_run_cli:app"
constructionsight-ceqanet-csv = "constructionsight.ceqanet_csv_cli:app"
constructionsight-ceqanet-maturity = "constructionsight.ceqanet_maturity_proposal_cli:app"
constructionsight-ceqanet-access-policy = "constructionsight.ceqanet_csv_access_policy_cli:app"
constructionsight-ceqanet-evidence-series = "constructionsight.ceqanet_csv_evidence_series_cli:app"
constructionsight-ceqanet-vocabulary = "constructionsight.ceqanet_vocabulary_export_cli:app"
constructionsight-ceqanet-results = "constructionsight.ceqanet_result_parse_cli:app"
constructionsight-ceqanet-detail = "constructionsight.ceqanet_detail_parse_cli:app"
constructionsight-ceqanet-detail-execute = "constructionsight.ceqanet_detail_execute_cli:app"
constructionsight-ceqanet-enrichment = "constructionsight.ceqanet_detail_enrichment_cli:app"
constructionsight-ceqanet-chain = "constructionsight.ceqanet_chain_cli:app"
constructionsight-ceqanet-persistence-preview = "constructionsight.ceqanet_persistence_preview_cli:app"
constructionsight-ceqanet-write-plan = "constructionsight.ceqanet_write_plan_cli:app"
constructionsight-ceqanet-persistence-apply = "constructionsight.ceqanet_persistence_execute_cli:app"
constructionsight-ceqanet-operator-package = "constructionsight.ceqanet_operator_package_cli:app"
constructionsight-ceqanet-operator-report = "constructionsight.ceqanet_operator_report_cli:app"
constructionsight-ceqanet-operator-bundle = "constructionsight.ceqanet_operator_bundle_cli:app"
constructionsight-ceqanet-operator-bundle-verify = "constructionsight.ceqanet_operator_bundle_verify_cli:app"
constructionsight-ceqanet-operator-export = "constructionsight.ceqanet_operator_export_cli:app"
constructionsight-ceqanet-operator-archive = "constructionsight.ceqanet_operator_archive_cli:app"
constructionsight-ceqanet-operator-archive-verify = "constructionsight.ceqanet_operator_archive_verify_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/constructionsight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
