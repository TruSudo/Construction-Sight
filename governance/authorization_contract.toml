schema_version = "constructionsight.authorization-contract/v1"
contract_id = "construction-sight-authorization-2026-07-15"
hosted_identity_supported = false
tenant_isolation_supported = false
delegation_supported = false
impersonation_supported = false
temporary_elevation_supported = false

[[operations]]
id = "CS-AUTH-001"
module_patterns = ["src/constructionsight/(?:cli|.*_cli)\\.py"]
action = "invoke an operator-visible mutation or evidence-issuing command"
resource = "exact command resource, artifact path, expected identity, and current state"
impact = "high"
actor_model = "explicit local operator identifier; not authentication"
exact_scope = "command, resource identity, requested transition, output path, and bounded parameters"
current_state = "typed current state loaded immediately before execution"
granted_authority = ["one exact command execution within declared scope"]
denied_authority = ["scope expansion", "generic editing", "network bypass", "recurrence", "sending", "destructive overwrite"]
issuance = "operation-specific service preflight after explicit caller confirmation"
validity = "single invocation and current exact state"
reuse_rule = "no reuse when an operation is single-use; exact replay only where doctrine explicitly permits"
revocation_rule = "state or identity change invalidates authority"
reason_required = true
expected_identity = "required for high-impact operations"
stale_state_rule = "compare expected and current identity/state; reject disagreement"
audit_identity = "content-bound operation or service audit ID"
audit_event = "append-only or durable report required before success"
failure_posture = "fail-closed"
boolean_confirmation_allowed = true

[[operations]]
id = "CS-AUTH-002"
module_patterns = ["src/constructionsight/storage/.*\\.py", "src/constructionsight/(?:source_registry_apply_service|ceqanet_persistence_execute)\\.py"]
action = "apply database or durable file mutation"
resource = "exact typed record, predecessor/current state, destination, and payload identity"
impact = "high"
actor_model = "scope-bound authorization supplied by canonical service"
exact_scope = "record family, identity, operation, destination, expected state, and allowed field changes"
current_state = "transactionally loaded immediately before mutation"
granted_authority = ["one exact insert, exact replay, compare-and-swap update, or governed status-only apply"]
denied_authority = ["generic correction", "destructive overwrite", "identity substitution", "stale write", "source promotion beyond plan", "audit omission"]
issuance = "canonical application service after validation"
validity = "transaction or atomic file replacement only"
reuse_rule = "only exact idempotent replay when explicitly modeled"
revocation_rule = "state, digest, schema, policy, or destination change invalidates authority"
reason_required = true
expected_identity = "required"
stale_state_rule = "reject stale or conflicting writers"
audit_identity = "operation-specific immutable event or report digest"
audit_event = "must persist atomically with or before success acknowledgement"
failure_posture = "fail-closed"
boolean_confirmation_allowed = false

[[operations]]
id = "CS-AUTH-003"
module_patterns = ["(?!src/constructionsight/(?:cli|.*_cli)\\.py$)(?!src/constructionsight/storage/.*\\.py$)(?!src/constructionsight/(?:source_registry_apply_service|ceqanet_persistence_execute)\\.py$)src/constructionsight/.*\\.py"]
action = "execute a canonical service transition, result correction, evidence issuance, artifact mutation, or guarded network preflight"
resource = "exact domain object, evidence, policy, expected identity, output, and current state"
impact = "high"
actor_model = "explicit operator identity or caller identity bound to a complete decision object"
exact_scope = "action, resource, current state, requested outcome, bounded parameters, negative authority, and validity window"
current_state = "validated immediately before effect"
granted_authority = ["only the exact operation declared by the operation-specific contract"]
denied_authority = ["authority expansion", "automatic correction", "promotion from missing evidence", "recurrence", "sending", "credential use", "access-control bypass"]
issuance = "operation-specific builder and independent preflight"
validity = "single-use or explicitly reusable exact replay as declared"
reuse_rule = "single-use by default"
revocation_rule = "expiry, consumption, policy change, state change, or expected-identity mismatch"
reason_required = true
expected_identity = "required for mutations, promotions, corrections, and evidence issuance"
stale_state_rule = "reject stale, future, naive-time, conflicting, or mismatched state"
audit_identity = "content digest over authority-significant fields"
audit_event = "durable typed event/report with granted and denied authority"
failure_posture = "fail-closed"
boolean_confirmation_allowed = true
