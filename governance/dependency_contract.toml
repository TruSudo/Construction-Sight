schema_version = "constructionsight.dependency-contract/v1"
contract_id = "construction-sight-dependencies-2026-07-15"
supported_python = ["3.11", "3.12"]
supported_runner = "github-hosted-ubuntu-x86_64"
lock_files = ["requirements/py311.lock", "requirements/py312.lock"]
lock_format = "pip-requirements-sha256-v1"
require_hashes = true
binary_only = true
reject_unexpected_installed_distributions = true
expected_project_distribution = "constructionsight==0.1.0"
bootstrap_distributions = ["pip==26.2", "setuptools==83.0.0", "wheel==0.47.0"]
install_policy = "Install the exact artifact-hashed environment lock with --require-hashes, --only-binary=:all:, and --no-deps; then install ConstructionSight editable with --no-deps and --no-build-isolation."
hash_policy = "Every logical lock row must bind one exact version to reviewed SHA-256 wheel identities for the declared Python and runner environment. Unhashed, source, alternate, malformed, duplicate, or noncanonical rows fail certification."
vulnerability_tool = "Repository-owned standard-library offline certifier; bounded isolated collector; release-specific PyPI JSON sources retained and hashed"
vulnerability_failure_policy = "Fail on every known vulnerability unless a narrow owned expiring exception is present. Scanner or advisory failure is itself fatal."
vulnerability_exceptions = "governance/vulnerability_exceptions.toml"
sbom_format = "CycloneDX 1.5 JSON"
sbom_output = "reports/sbom-py${PYTHON_VERSION}.json"
review_evidence = "docs/adr/ADR-0002-dependency-governance.md"

[[dependencies]]
name = "hatchling"
canonical_project = "hatchling"
extras = []
version = "1.27.0"
classification = "build"
purpose = "PEP 517 build backend for the ConstructionSight package."
capabilities = ["CS-CAP-002"]
authoritative_registry = "https://pypi.org/project/hatchling/1.27.0/"
authoritative_project_source = "https://github.com/pypa/hatch"
license = "MIT"
security_review = "Canonical PyPI identity and upstream source verified; exact version selected for Python 3.11 and 3.12 support."
maintenance_review = "Active PyPA project with a documented build-backend scope."
reviewed_on = "2026-07-15"
review_process = "Verify PyPI project identity, upstream ownership, release metadata, license, supported Python, and vulnerability result before changing."
replacement_considerations = "stdlib packaging is unavailable; replacement requires a separate reproducibility and migration review."

[[dependencies]]
name = "certifi"
canonical_project = "certifi"
extras = []
version = "2025.6.15"
classification = "runtime"
purpose = "Owned Mozilla CA bundle for public TLS verification without ambient trust-store authority."
capabilities = ["CS-CAP-005"]
authoritative_registry = "https://pypi.org/project/certifi/2025.6.15/"
authoritative_project_source = "https://github.com/certifi/python-certifi"
license = "MPL-2.0"
security_review = "Canonical certifi identity and pinned CA-bundle release verified; the bounded transport loads only this reviewed bundle."
maintenance_review = "Maintained upstream; CA-bundle changes require dependency, TLS, and advisory review."
reviewed_on = "2026-08-22"
review_process = "Verify release identity, Mozilla bundle provenance, certificate-store behavior, advisories, and both supported Python locks."
replacement_considerations = "A system trust store would reacquire ambient authority; replacement requires an equally explicit reviewed trust-root source."

[[dependencies]]
name = "httpcore"
canonical_project = "httpcore"
extras = []
version = "1.0.9"
classification = "runtime"
purpose = "Public connection-pool and network-backend interfaces used to pin reviewed DNS resolution to TCP."
capabilities = ["CS-CAP-005"]
authoritative_registry = "https://pypi.org/project/httpcore/1.0.9/"
authoritative_project_source = "https://github.com/encode/httpcore"
license = "BSD-3-Clause"
security_review = "Canonical Encode project identity and public NetworkBackend API verified; only the bounded transport imports it."
maintenance_review = "Maintained upstream; network-backend and TLS behavior are fixed by exact version and focused regression evidence."
reviewed_on = "2026-08-22"
review_process = "Verify project identity, release provenance, public transport API, advisories, DNS-to-connect semantics, and lock compatibility."
replacement_considerations = "A custom socket-level HTTP implementation would increase protocol risk; upgrades require re-review of pinning semantics."

[[dependencies]]
name = "httpx"
canonical_project = "httpx"
extras = ["socks"]
version = "0.28.1"
classification = "runtime"
purpose = "Bounded HTTP transport behind approved policy modules."
capabilities = ["CS-CAP-005"]
authoritative_registry = "https://pypi.org/project/httpx/0.28.1/"
authoritative_project_source = "https://github.com/encode/httpx"
license = "BSD-3-Clause"
security_review = "Canonical Encode project identity verified; only approved transport modules may import it."
maintenance_review = "Maintained upstream; version and transitive graph are locked."
reviewed_on = "2026-07-15"
review_process = "Verify project identity, release provenance, transport behavior, advisories, and compatibility with complete network policies."
replacement_considerations = "urllib is a possible narrower replacement but would require equivalent timeout, redirect, byte-retention, and SOCKS doctrine."

[[dependencies]]
name = "pydantic"
canonical_project = "pydantic"
extras = []
version = "2.11.7"
classification = "runtime"
purpose = "Strict immutable schemas, validators, and exact serialization contracts."
capabilities = ["CS-CAP-007", "CS-CAP-008"]
authoritative_registry = "https://pypi.org/project/pydantic/2.11.7/"
authoritative_project_source = "https://github.com/pydantic/pydantic"
license = "MIT"
security_review = "Canonical identity verified; native pydantic-core is explicitly locked."
maintenance_review = "Actively maintained; compatibility changes require schema and replay review."
reviewed_on = "2026-07-15"
review_process = "Review release notes, pydantic-core identity, serialization changes, validation behavior, advisories, and historical-payload compatibility."
replacement_considerations = "Dataclasses plus handwritten validation would reduce dependencies but materially increase validation and compatibility risk."

