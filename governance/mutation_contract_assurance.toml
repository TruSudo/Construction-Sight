schema_version = "constructionsight.mutation-contract/v1"
contract_id = "construction-sight-focused-assurance-mutations-2026-09-14"
execution = "Every case runs in a temporary full source overlay. The tracked tree is never modified."
timeout_seconds = 120

[[cases]]
id = "CS-MUT-ASSURANCE-EVIDENCE-DIGEST-001"
path = "src/constructionsight/assurance_certification.py"
search = '''    if actual_digest != raw_digest:
        _record(
            findings,
            "ASSURANCE-010",'''
replacement = '''    if False and actual_digest != raw_digest:
        _record(
            findings,
            "ASSURANCE-010",'''
tests = ["tests/test_assurance_certification.py::test_assurance_rejects_evidence_digest_mismatch"]
expected_output = "test_assurance_rejects_evidence_digest_mismatch"
risk = "Pass or gate evidence could be changed after review without invalidating its assurance claim."

[[cases]]
id = "CS-MUT-ASSURANCE-CONTEXT-AGGREGATION-001"
path = "src/constructionsight/assurance_certification.py"
search = '''        if completed_reviews != 1:'''
replacement = '''        if False and completed_reviews != 1:'''
tests = ["tests/test_assurance_certification.py::test_assurance_rejects_aggregated_completed_reviews"]
expected_output = "test_assurance_rejects_aggregated_completed_reviews"
risk = "One analytical record could claim several supposedly context-isolated reviews and satisfy native review cardinality without distinct contexts."

[[cases]]
id = "CS-MUT-ASSURANCE-SOURCE-PLACEHOLDER-001"
path = "src/constructionsight/assurance_certification.py"
search = '''        or raw_digest == "0" * 64'''
replacement = '''        or False'''
tests = ["tests/test_assurance_certification.py::test_assurance_rejects_placeholder_source_hash"]
expected_output = "test_assurance_rejects_placeholder_source_hash"
risk = "A syntactically valid all-zero digest could masquerade as retained raw assurance provenance."

[[cases]]
id = "CS-MUT-ASSURANCE-SOURCE-DIGEST-001"
path = "src/constructionsight/assurance_certification.py"
search = '''    if actual_digest != raw_digest:
        _record(
            findings,
            "ASSURANCE-027",'''
replacement = '''    if False and actual_digest != raw_digest:
        _record(
            findings,
            "ASSURANCE-027",'''
tests = ["tests/test_assurance_certification.py::test_assurance_rejects_source_digest_mismatch"]
expected_output = "test_assurance_rejects_source_digest_mismatch"
risk = "Retained raw assurance source bytes could be changed without invalidating normalized provenance."

[[cases]]
id = "CS-MUT-ASSURANCE-SOURCE-COMMIT-001"
path = "src/constructionsight/assurance_certification.py"
search = '''        or payload.get("reviewed_commit") != reviewed_commit'''
replacement = '''        or False'''
tests = ["tests/test_assurance_certification.py::test_assurance_rejects_cross_commit_source_artifact"]
expected_output = "test_assurance_rejects_cross_commit_source_artifact"
risk = "Raw assurance evidence from another commit could be rebound to the current reviewed tree."

[[cases]]
id = "CS-MUT-ASSURANCE-SOURCE-REUSE-001"
path = "src/constructionsight/assurance_certification.py"
search = '''        if prior is not None and prior != label:'''
replacement = '''        if False and prior is not None and prior != label:'''
tests = ["tests/test_assurance_certification.py::test_assurance_rejects_reused_source_artifact"]
expected_output = "source artifact is reused"
risk = "One retained raw source could be presented as evidence for multiple supposedly distinct analytical or quality-gate contexts."
