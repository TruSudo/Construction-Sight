schema_version = "constructionsight.active-defects/v1"
certification_requires_zero = true

[[defects]]
id = "CS-SR-076"
severity = "P1"
area = "intelligence-history-integrity"
root_cause = "Intelligence evidence, entity, relationship, project-cluster, opportunity, and runtime-event persistence updates existing rows in place. Graph-service update events also reuse stable event IDs, so later assertions can replace prior state and prior event content instead of preserving auditable history."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Make history-bearing intelligence assertions and graph events immutable or explicitly versioned, reject semantic ID collisions, preserve predecessor/history linkage, and add update/replay regressions proving prior evidence and state remain reconstructable."

[[defects]]
id = "CS-SR-077"
severity = "P1"
area = "intelligence-evidence-binding"
root_cause = "Core intelligence relationship, project, opportunity, and identity schemas permit authoritative or high-confidence assertions without retained evidence references, while persistence does not require referenced evidence to exist."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Require evidence-bearing provenance for intelligence assertions according to status/confidence, verify referenced evidence exists at persistence/service boundaries, preserve contradictions and limitations, and add unsupported-assertion regressions."

[[defects]]
id = "CS-SR-078"
severity = "P1"
area = "intelligence-reference-integrity"
root_cause = "Persisted intelligence relationships and evidence references are unconstrained strings or JSON references and can point to missing entities, project clusters, or evidence records."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Enforce relationship endpoint and supporting-evidence existence with relational constraints or equivalent fail-closed application checks, preserve valid cross-type graph targets explicitly, and add orphan-reference regressions."

[[defects]]
id = "CS-SR-079"
severity = "P1"
area = "intelligence-query-completeness"
root_cause = "Relationship and neighborhood services call intelligence list methods with their default limit of 100, silently excluding older valid records and using the truncated set for existence classification."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Replace implicit global 100-row scans with complete database-side filtered queries or explicit exhaustive pagination, remove truncated existence checks, and add datasets larger than 100 rows proving complete graph answers."

[[defects]]
id = "CS-SR-080"
severity = "P1"
area = "permit-history-integrity"
root_cause = "Permit snapshots use caller-selected IDs that may be reused for changed content, while transition IDs omit occurrence identity. Store helpers update matching rows in place, allowing repeated lifecycle observations to collapse."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Bind snapshot identities to immutable observation content, represent repeated transition occurrences distinctly, reject semantic ID collisions instead of overwriting history, and add repeated-cycle and replay regressions."

[[defects]]
id = "CS-SR-081"
severity = "P2"
area = "sqlite-referential-integrity"
root_cause = "The main SQLAlchemy SQLite engine declares foreign keys in ORM/schema governance but does not enable PRAGMA foreign_keys=ON for every connection, so declared constraints are not runtime-enforced."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Enable and verify SQLite foreign-key enforcement on every primary database connection without weakening non-SQLite support, add orphan-write regressions, and include enforcement in schema/runtime certification."

[[defects]]
id = "CS-SR-082"
severity = "P1"
area = "source-registry-authorization-bypass"
root_cause = "Legacy CLI paths can directly upsert source-registry rows or verification results without passing through the current exact-scope authorization and durable effect-consumption boundary."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Route every operator-visible authoritative source-registry mutation through one canonical scope-bound authorized service with durable single-effect consumption, remove or fail closed legacy direct writers, and add bypass-path certification and regressions."

[[defects]]
id = "CS-SR-083"
severity = "P1"
area = "source-verification-state-semantics"
root_cause = "SourceVerifier returns url_reachable=false when lawful-access facts are merely unreviewed, and VerificationStore maps every unreachable result to verification_status=failed, converting an unknown/review-required condition into an observed source failure."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Preserve access-decision semantics through persistence, prevent REVIEW_REQUIRED or BLOCKED-without-reachability observations from being classified as network failure, and add regressions distinguishing unknown access, blocked access, and actual reachability failure."

[[defects]]
id = "CS-SR-084"
severity = "P1"
area = "effect-consumption-global-uniqueness"
root_cause = "Protected-effect consumption uses a relative SQLite path and does not pin a canonical owned database identity, so processes launched from different working directories or redirected filesystem paths can reserve the same logical allowance independently."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Anchor the consumption ledger to one canonical application-owned path, reject symlink/path substitution and insecure parent state, preserve cross-process atomic reservation, and add different-CWD, symlink, restart, and concurrent reservation regressions."

[[defects]]
id = "CS-SR-085"
severity = "P1"
area = "intelligence-evidence-content-identity"
root_cause = "EvidenceRecord accepts caller-selected evidence_id and content_hash without deriving or validating them from retained content, while the store overwrites matching evidence IDs."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Define canonical evidence-content serialization and full digest identity, validate stored hashes/IDs against content, make evidence immutable or versioned, and add collision/tamper/replay regressions."

[[defects]]
id = "CS-SR-086"
severity = "P2"
area = "ceqanet-write-plan-target-integrity"
root_cause = "CEQAnet persistence validation accepts caller-supplied operation_id, target_key, and source_index without proving they match the validated model's actual canonical target key and source position, allowing audit metadata to disagree with what is written."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Recompute and require exact operation IDs, target keys, and source indexes from each validated payload and collection, fail closed on any mismatch, and add tampered-plan regressions."

[[defects]]
id = "CS-SR-087"
severity = "P2"
area = "repository-status-documentation"
root_cause = "Operator-facing current-status documentation reports dozens of active defects even though the authoritative governance ledger at the reviewed commit reports zero, creating contradictory repository state."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Update current-status documentation and README defect counts from authoritative governance state, prevent stale hard-coded defect totals where practical, and add a consistency regression if these files claim canonical status."

[[defects]]
id = "CS-SR-088"
severity = "P1"
area = "site-resolution-evidence-binding"
root_cause = "Site-resolution models allow APN/address/geometry signals without retained evidence references, and scoring can mark the resulting site resolved despite no evidence ID establishing the source of those signals."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Require evidence references for resolution-bearing site identifiers and geometry, prohibit resolved status without retained provenance, preserve explicit fallback limitations, and add evidence-free resolution regressions."

[[defects]]
id = "CS-SR-089"
severity = "P1"
area = "normalized-domain-history"
root_cause = "Normalized Site, Entity, Permit, PlanningCase, CEQA, Agenda, Document, and Relationship stores update stable-key rows in place, erasing earlier source facts and provenance required for longitudinal auditability."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Introduce immutable observation/version history or equivalent append-only audit records for material normalized-domain changes, retain current projections separately if needed, and add history reconstruction regressions."

[[defects]]
id = "CS-SR-090"
severity = "P1"
area = "lead-workflow-mutation-boundary"
root_cause = "store_lead_workflow_record can replace an existing workflow projection and embedded event history without compare-and-swap predecessor validation, while immutable event rows remain separate, allowing projection/event divergence outside the governed transition path."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Restrict existing-workflow mutation to the compare-and-swap transition boundary or enforce exact predecessor/event-history equivalence in direct storage, reconcile embedded and durable events, and add bypass/concurrency regressions."

[[defects]]
id = "CS-SR-091"
severity = "P2"
area = "derived-result-content-identity"
root_cause = "Site-resolution and parcel-assurance persistence accepts caller-provided result IDs and updates existing rows without independently recomputing canonical identity or rejecting changed semantic content under the same ID."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Recompute canonical derived-result identity at model/store boundaries, reject mismatched or semantically changed replay under an existing ID, preserve immutable historical results, and add forged-ID/collision regressions."

[[defects]]
id = "CS-SR-092"
severity = "P1"
area = "defect-closure-evidence-accuracy"
root_cause = "The permanent CS-SR-011 closure summary states that repository/semantic certification passed, but the cited exact-head CI run completed with mandatory quality-gate failure and repository certification blockers."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Correct the permanent closure evidence to accurately distinguish passing individual sub-gates from the failed aggregate/repository certification result, retain the exact run provenance, and add a regression preventing unsupported closure claims."

[[defects]]
id = "CS-SR-093"
severity = "P1"
area = "defect-closure-semantic-certification"
root_cause = "Defect-closure certification validates ledger shape, commit ancestry, tree provenance, and path existence but does not establish that resolution summaries and referenced evidence actually satisfy each defect's required resolution."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Add deterministic semantic closure evidence binding sufficient to reject materially unsupported or contradictory closure claims, without relying on self-asserted prose alone, and add tampered/false-evidence regressions."

[[defects]]
id = "CS-SR-094"
severity = "P1"
area = "ceqanet-network-authorization-bypass"
root_cause = "The legacy discover-ceqanet operator command performs a live CEQAnet HTTP request directly through the bounded transport without canonical scope-bound authorization or durable effect consumption."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Require explicit operator authorization and durable single-effect consumption for CEQAnet discovery, or retire the live legacy path in favor of an already governed equivalent, and add repeated/bypass execution regressions."

[[defects]]
id = "CS-SR-095"
severity = "P1"
area = "ceqanet-daily-network-invariant"
root_cause = "The daily CEQAnet evidence runner checks required_utc_date at reservation time but does not recheck immediately before the live effect. A reservation crossing UTC midnight can execute on the next day using the previous day's allowance, then fail validation after the request has already occurred."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Revalidate date-bound allowances immediately before crossing the protected effect boundary, persist terminal failure without issuing the request on rollover, and add deterministic UTC-midnight contention regressions."

[[defects]]
id = "CS-SR-096"
severity = "P2"
area = "semantic-authorization-coverage"
root_cause = "Semantic authorization certification depends on a manually enumerated effect-target set and a small list of recognized CLI confirmation parameter names, so high-impact network or storage mutations can remain unclassified and bypass certification."
discovered_against = "539939a8cdef813b919b1c725fa1439d03d97ea7"
required_resolution = "Derive or comprehensively enumerate governed high-impact mutation/network boundaries, cover storage mutation entry points and alternate CLI parameter names, fail closed on unresolved high-impact calls, and add witnesses proving newly introduced effects cannot escape the authorization graph."
