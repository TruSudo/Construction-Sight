[[cases]]
id = "CS-MUT-REGISTRY-SHARED-OUTPUT-LOCK-001"
path = "src/constructionsight/source_registry_update_plan_cli.py"
search = "            fcntl.flock(fd, fcntl.LOCK_EX)"
replacement = "            pass"
tests = ["tests/test_source_registry_update_plan.py::test_registry_writers_sharing_audit_are_serialized_across_processes"]
expected_output = "test_registry_writers_sharing_audit_are_serialized_across_processes"
