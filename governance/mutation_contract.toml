schema_version = "constructionsight.mutation-contract/v1"
contract_id = "construction-sight-focused-mutations-2026-07-15"
execution = "Every case runs in a temporary full source overlay. The tracked tree is never modified."
timeout_seconds = 120

[[cases]]
id = "CS-MUT-AUTH-EXPIRY-001"
path = "src/constructionsight/authorization_decision.py"
search = "if checked_at >= decision.expires_at:"
replacement = "if checked_at > decision.expires_at:"
tests = ["tests/test_authorization_decision.py::test_preflight_rejects_expiry_revocation_scope_and_stale_state"]
expected_output = "test_preflight_rejects_expiry_revocation_scope_and_stale_state"
risk = "An authorization valid exactly at its exclusive expiry boundary could execute."

[[cases]]
id = "CS-MUT-AUTH-REUSE-001"
path = "src/constructionsight/authorization_decision.py"
search = "raise AuthorizationDeniedError(\"single-use authorization was already consumed\")"
replacement = "return \"exact_replay\""
tests = ["tests/test_authorization_decision.py::test_single_use_claim_allows_only_one_concurrent_caller"]
expected_output = "test_single_use_claim_allows_only_one_concurrent_caller"
risk = "Concurrent callers could reuse a single-use high-impact authorization."

[[cases]]
id = "CS-MUT-AUTH-BOOLEAN-001"
path = "src/constructionsight/local_operator_authorization.py"
search = "if not caller_confirmation:"
replacement = "if caller_confirmation:"
tests = ["tests/test_local_operator_authorization.py::test_boolean_confirmation_is_not_authority"]
expected_output = "test_boolean_confirmation_is_not_authority"
risk = "A bare Boolean could replace rather than supplement a complete scope-bound decision."

[[cases]]
id = "CS-MUT-AUTH-UNICODE-001"
path = "src/constructionsight/local_operator_authorization.py"
search = "normalized = unicodedata.normalize(\"NFC\", value).strip()"
replacement = "normalized = value.strip()"
tests = ["tests/test_local_operator_authorization.py::test_local_authorization_normalizes_identity_and_emits_redacted_audit"]
expected_output = "test_local_authorization_normalizes_identity_and_emits_redacted_audit"
risk = "Canonically equivalent operator or scope identities could produce different authority identities."

[[cases]]
id = "CS-MUT-AUTH-EFFECT-TARGET-001"
path = "src/constructionsight/semantic_authorization_certification.py"
search = "        \"constructionsight.http_transport.execute_bounded_http\","
replacement = "        \"constructionsight.http_transport.execute_bounded_http_disabled\","
tests = ["tests/test_semantic_authorization_certification.py::test_direct_resolved_effect_is_rejected_without_authorization"]
expected_output = "test_direct_resolved_effect_is_rejected_without_authorization"
risk = "An imported or aliased canonical effect target could disappear from the resolved authorization graph."

[[cases]]
id = "CS-MUT-AUTH-DOMINANCE-001"
path = "src/constructionsight/semantic_authorization_certification.py"
search = "            if state.phase is not _AuthorizationPhase.AUTHORIZED:"
replacement = "            if False and state.phase is not _AuthorizationPhase.AUTHORIZED:"
tests = ["tests/test_semantic_authorization_certification.py::test_branch_bypass_is_rejected", "tests/test_semantic_authorization_certification.py::test_effect_before_authorization_is_rejected"]
expected_output = "test_effect_before_authorization_is_rejected"
risk = "An effect could execute on a branch where canonical authorization or preflight did not dominate it."

[[cases]]
id = "CS-MUT-AUTH-LEAD-CONFIRM-001"
path = "src/constructionsight/operator_services/lead_workflow_transition_service.py"
search = "    if not caller_confirmation:"
replacement = "    if caller_confirmation:"
tests = ["tests/test_lead_workflow_transition_authorization.py::test_transition_requires_scope_bound_confirmation"]
expected_output = "test_transition_requires_scope_bound_confirmation"
risk = "A lead workflow transition could execute without caller confirmation supplementing exact authority."

[[cases]]
id = "CS-MUT-AUTH-RESULT-CONFIRM-001"
path = "src/constructionsight/operator_services/result_authority_apply_service.py"
search = "    if not caller_confirmation:"
replacement = "    if caller_confirmation:"
tests = ["tests/test_result_authority_apply_authorization.py::test_result_authority_requires_scope_bound_confirmation"]
expected_output = "test_result_authority_requires_scope_bound_confirmation"
risk = "An authoritative result mutation could execute without caller confirmation supplementing exact authority."

[[cases]]
id = "CS-MUT-NET-REDIRECT-001"
path = "src/constructionsight/http_transport.py"
search = "if 300 <= response.status_code < 400:"
replacement = "if 300 <= response.status_code < 302:"
tests = ["tests/test_http_transport.py::test_bounded_http_denies_redirect_without_following_location"]
expected_output = "test_bounded_http_denies_redirect_without_following_location"
risk = "A redirect status could escape the terminal redirect classification."

[[cases]]
id = "CS-MUT-NET-SIZE-001"
path = "src/constructionsight/http_transport.py"
search = "if declared_length > policy.max_response_bytes:"
replacement = "if declared_length < policy.max_response_bytes:"
tests = ["tests/test_http_transport.py::test_bounded_http_rejects_declared_oversized_response_without_body_read"]
expected_output = "test_bounded_http_rejects_declared_oversized_response_without_body_read"
risk = "An oversized response could be read despite the declared byte ceiling."

[[cases]]
id = "CS-MUT-CSV-IDENTITY-001"
path = "src/constructionsight/ceqanet_csv_live_service.py"
search = "allowed_request_urls=(request_url,),"
replacement = "allowed_request_urls=(),"
tests = ["tests/test_ceqanet_csv_live.py::test_live_execution_performs_exactly_one_get_without_redirect_or_retry"]
expected_output = "test_live_execution_performs_exactly_one_get_without_redirect_or_retry"
risk = "A CEQAnet CSV query could execute without exact canonical request-identity authority."

[[cases]]
id = "CS-MUT-NET-QUERY-AUTHORITY-001"
path = "src/constructionsight/http_transport.py"
search = "elif parsed.query:"
replacement = "elif False and parsed.query:"
tests = ["tests/test_http_transport.py::test_bounded_http_requires_executable_authority_for_any_query"]
expected_output = "test_bounded_http_requires_executable_authority_for_any_query"
risk = "A query could execute under prose-only host/path scope without an exact request identity."

[[cases]]
id = "CS-MUT-NET-CANONICAL-PATH-001"
path = "src/constructionsight/http_transport_models.py"
search = "if path_component and decoded_character in _AMBIGUOUS_ENCODED_PATH_CHARACTERS:"
replacement = "if False and path_component and decoded_character in _AMBIGUOUS_ENCODED_PATH_CHARACTERS:"
tests = ["tests/test_http_transport.py::test_bounded_http_rejects_ambiguous_url_forms_before_execution"]
expected_output = "test_bounded_http_rejects_ambiguous_url_forms_before_execution"
risk = "Encoded path separators or dot segments could be authorized under a representation different from the transmitted path."

[[cases]]
id = "CS-MUT-NET-CLIENT-TYPE-001"
path = "src/constructionsight/http_transport.py"
search = "if client is not None and not isinstance(client, httpx.Client):"
replacement = "if False and client is not None and not isinstance(client, httpx.Client):"
tests = ["tests/test_http_transport.py::test_bounded_http_rejects_legacy_alternate_client_protocol"]
expected_output = "test_bounded_http_rejects_legacy_alternate_client_protocol"
risk = "A legacy alternate client protocol could bypass the common httpx streamed execution contract."

[[cases]]
id = "CS-MUT-LISTING-RETRY-001"
path = "src/constructionsight/adapters/ceqanet_listing_executor.py"
search = "if self.max_attempts != 1 or self.retry_delays_seconds:"
replacement = "if self.max_attempts < 1:"
tests = ["tests/test_ceqanet_listing_executor.py::test_ceqanet_listing_executor_rejects_invalid_runtime_bounds"]
expected_output = "test_ceqanet_listing_executor_rejects_invalid_runtime_bounds"
risk = "Listing execution could silently expand from one attempt into retries that contradict CS-NET-002."

[[cases]]
id = "CS-MUT-LISTING-PLAN-IDENTITY-001"
path = "src/constructionsight/adapters/ceqanet_listing_executor.py"
search = "if plan != canonical_plan:"
replacement = "if False and plan != canonical_plan:"
tests = ["tests/test_ceqanet_listing_executor.py::test_ceqanet_listing_executor_rejects_forged_query_before_http"]
expected_output = "test_ceqanet_listing_executor_rejects_forged_query_before_http"
risk = "A forged listing query could become its own transport authority instead of remaining bound to canonical planner output."

[[cases]]
id = "CS-MUT-PERSIST-SNAPSHOT-001"
path = "src/constructionsight/operator_services/ceqanet_persistence_service.py"
search = "    execution = active_executor(execution_payload, database_url)"
replacement = "    execution = active_executor(write_plan_payload, database_url)"
tests = ["tests/test_ceqanet_persistence_operator_service.py::test_persistence_facade_executes_only_a_deeply_detached_snapshot", "tests/test_ceqanet_persistence_operator_service.py::test_authorization_callback_mutation_cannot_change_snapshot_or_effect"]
expected_output = "test_authorization_callback_mutation_cannot_change_snapshot_or_effect"
risk = "Caller-owned nested write-plan content could change after authorization and reach the persistence effect."

[[cases]]
id = "CS-MUT-PERSIST-RECHECK-001"
path = "src/constructionsight/operator_services/ceqanet_persistence_service.py"
search = "    if current_plan_digest != snapshot.plan_digest:"
replacement = "    if False and current_plan_digest != snapshot.plan_digest:"
tests = ["tests/test_ceqanet_persistence_operator_service.py::test_persistence_facade_rechecks_snapshot_identity_before_effect"]
expected_output = "test_persistence_facade_rechecks_snapshot_identity_before_effect"
risk = "A detached persistence snapshot could execute without a final exact-identity recheck."

[[cases]]
id = "CS-MUT-DEFECT-FACTS-001"
path = "src/constructionsight/defect_closure_certification.py"
search = "        if closure_facts != original:"
replacement = "        if False and closure_facts != original:"
tests = ["tests/test_review_binding_certification.py::test_closure_rejects_changed_reviewed_defect_facts"]
expected_output = "test_closure_rejects_changed_reviewed_defect_facts"
risk = "Finalization could rewrite original severity, area, root cause, discovery, or required-resolution facts after review."

[[cases]]
id = "CS-MUT-DEFECT-ANCESTRY-001"
path = "src/constructionsight/defect_closure_certification.py"
search = "        if not ancestor:"
replacement = "        if False and not ancestor:"
tests = ["tests/test_review_binding_certification.py::test_closure_rejects_resolution_outside_reviewed_history"]
expected_output = "test_closure_rejects_resolution_outside_reviewed_history"
risk = "A resolution commit outside the reviewed implementation history could be claimed as closure evidence."

[[cases]]
id = "CS-MUT-ARCH-BYPASS-001"
path = "src/constructionsight/architecture_boundary_certification.py"
search = "if source_layer != \"transport\":"
replacement = "if source_layer == \"transport\":"
tests = ["tests/test_architecture_boundary_certification.py::test_low_level_http_engine_cannot_be_imported_by_application"]
expected_output = "test_low_level_http_engine_cannot_be_imported_by_application"
risk = "Application code could reacquire the low-level HTTP engine through a generic utility bypass."

[[cases]]
id = "CS-MUT-NET-EXPLICIT-REQUEST-001"
path = "src/constructionsight/http_transport.py"
search = """    response = session.send(
        request,"""
replacement = """    response = session.send(
        session.build_request(request.method, request.url),"""
tests = ["tests/test_http_transport.py::test_bounded_http_does_not_merge_injected_client_query_defaults"]
expected_output = "test_bounded_http_does_not_merge_injected_client_query_defaults"
risk = "Client-level query defaults could be merged after authorization if the bounded engine rebuilt the explicit request."

[[cases]]
id = "CS-MUT-NET-CLIENT-AUTH-001"
path = "src/constructionsight/http_transport.py"
search = "        auth=None,"
replacement = "        auth=httpx.USE_CLIENT_DEFAULT,"
tests = ["tests/test_http_transport.py::test_bounded_http_disables_injected_client_auth_mutation"]
expected_output = "test_bounded_http_disables_injected_client_auth_mutation"
risk = "Injected client authentication could mutate the exact request identity after authorization."

[[cases]]
id = "CS-MUT-NET-REQUEST-HOOK-001"
path = "src/constructionsight/http_transport.py"
search = """    if session.event_hooks.get("request"):"""
replacement = """    if False and session.event_hooks.get("request"):"""
tests = ["tests/test_http_transport.py::test_bounded_http_rejects_request_hooks_before_execution"]
expected_output = "test_bounded_http_rejects_request_hooks_before_execution"
risk = "An injected request hook could rewrite the authorized method or URL immediately before transmission."

[[cases]]
id = "CS-MUT-NET-RESPONSE-HOOK-001"
path = "src/constructionsight/http_transport.py"
search = """    if session.event_hooks.get("response"):"""
replacement = """    if False and session.event_hooks.get("response"):"""
tests = ["tests/test_http_transport.py::test_bounded_http_rejects_response_hooks_before_execution"]
expected_output = "test_bounded_http_rejects_response_hooks_before_execution"
risk = "A response hook could rewrite denied or malformed transport evidence before policy classification."

[[cases]]
id = "CS-MUT-NET-CSV-MEDIA-001"
path = "src/constructionsight/ceqanet_csv_live_service.py"
search = """_ACCEPTED_MEDIA_TYPES = (
    "application/csv",
    "application/vnd.ms-excel",
    "text/csv",
    "text/plain",
)"""
replacement = """_ACCEPTED_MEDIA_TYPES = (
    "application/csv",
    "application/vnd.ms-excel",
    "text/csv",
    "text/html",
    "text/plain",
)"""
tests = ["tests/test_ceqanet_csv_live.py::test_csv_validation_failure_is_retained_as_evidence"]
expected_output = "test_csv_validation_failure_is_retained_as_evidence"
risk = "An HTML login, denial, or error page could cross the CS-NET-003 media-type boundary as accepted CSV transport evidence."
