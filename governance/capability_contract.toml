[[capabilities]]
id = "CS-CAP-003"
status = "guarded"
business_intent = "Expose bounded operator commands without allowing persistence or network bypass around canonical services."
owning_layer = "cli"
module_patterns = ["src/constructionsight/(?:cli|.*_cli)\\.py"]
default_owner = false
tests = ["tests/test_governance_certification.py"]
doctrine = ["docs/architecture/semantic_governance.md"]
adrs = ["docs/adr/ADR-0004-authorization-boundaries.md"]
persistence = "artifact writes only when delegated to an authorized service"
operator_exposure = "local CLI; explicit operator identifier only"
network_authority = false
mutation_authority = true
authorization_model = "scope-bound operator decision plus canonical service preflight"
provenance_rule = "CLI arguments and expected identities are retained by the called service."
compatibility_rule = "CLI cannot reinterpret stored payloads or bypass typed loaders."
failure_rule = "Invalid scope, stale state, or missing authority terminates the command."
limitation_rule = "No authentication, delegation, impersonation, tenant isolation, or hosted identity is claimed."
negative_constraints = ["no direct database import", "no direct network client", "no generic editing", "no destructive overwrite", "no sending"]
future_entry_conditions = ["hosted identity and tenant isolation before GUI production readiness"]
replacement = ""
network_policy_ids = []
authorization_operation_ids = ["CS-AUTH-001"]

