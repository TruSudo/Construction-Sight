[[capabilities]]
id = "CS-CAP-001"
status = "implemented"
business_intent = "Expose immutable package identity without acquiring authority."
owning_layer = "package"
module_patterns = ["src/constructionsight/__init__\\.py"]
default_owner = false
tests = ["tests/test_governance_certification.py"]
doctrine = ["docs/architecture/semantic_governance.md"]
adrs = ["docs/adr/ADR-0001-architecture-contract.md"]
persistence = "none"
operator_exposure = "none"
network_authority = false
mutation_authority = false
authorization_model = "not-applicable"
provenance_rule = "Package metadata cannot create evidence or authority."
compatibility_rule = "Package version changes are explicit and reviewable."
failure_rule = "Import failure is visible; no fallback package identity."
limitation_rule = "No product capability follows from package import."
negative_constraints = ["no network", "no mutation", "no credentials", "no sending"]
future_entry_conditions = []
replacement = ""
network_policy_ids = []
authorization_operation_ids = []

