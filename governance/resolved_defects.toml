required_resolution = "Make unresolved duplicate review a hard non-actionable workflow invariant, prohibit activation or outreach-relevant transitions while duplicate review remains unresolved, bind the transition check to durable duplicate-review state, and add READY, ACTIVE, and concurrent transition regressions."
resolution_summary = "Made unresolved duplicate review a hard durable non-actionable invariant across initial workflow creation, authorized transitions, direct persistence, fingerprint drift, and concurrent attempts; made persisted duplicate results immutable and retained dedicated mutation/regression witnesses."
