[[defects]]
id = "CS-SR-052"
severity = "P1"
area = "result-ledger-content-identity"
root_cause = "Result ledger identity is derived from workflow, status, and revision without binding all semantically material outcome content, so materially different result records can share the same nominal ledger identifier."
discovered_against = "5f101b7bdddfd695904eb02144350e06207d9ded"
required_resolution = "Define canonical result-ledger serialization and a full content digest covering every material outcome field, bind authority events to that digest, keep revision or head identity separate from content identity, and add regressions proving any material mutation changes the content identity."
resolution_summary = "Added a canonical full-content SHA-256 digest across material result outcome fields, recomputed and validated it at model/history boundaries, separated revision identity from content identity, bound authority events to predecessor/current content digests, and added mutation/tamper regressions."
resolution_commit = "de1007dd04300b521b1b6ad5713b98ab82b11ddc"
resolution_tree = "a9c7c4f1a1d3221acb875550e0c82deff7df5d76"
