[[defects]]
id = "CS-SR-026"
severity = "P0"
area = "defect-closure-ledger-integrity"
root_cause = "Canonical governance-shape certification validates active defect entries but does not validate resolved defect entry shape, evidence paths, resolution provenance, duplicate IDs, or active/resolved disjointness. The ledger comment also requires exact-tree certification before a defect can move to resolved even though exact-tree certification is mechanically blocked while any defect remains active, creating a circular and unenforceable closure rule."
discovered_against = "e24eaea49fd9d05b256c2fac438e1a3d8d816657"
required_resolution = "Define and enforce an exact resolved-defect evidence schema; require unique IDs, full discovery and resolution commit provenance, nonblank resolution summary, safe existing regression/evidence paths, independent-review binding, and active/resolved disjointness; revise closure doctrine so correction, regression evidence, and independent review authorize the ledger move and canonical exact-tree CI certifies the resulting zero-active-defect tree; add malformed, duplicate, overlap, unsafe-path, and valid-closure regressions."
resolution_summary = "Replaced the circular all-at-once assurance prerequisite with an incremental Git-bound v2 closure model that preserves historical defect facts, exact correction/tree provenance, safe evidence and regression paths, active/resolved disjointness, and one-at-a-time permanent closure while retaining final zero-active Native Maximum Assurance."
resolution_commit = "53845f5bfa0d9b9c312de49eadfd7aae0178e8d9"
resolution_tree = "1f2a7265d0c2eb448d994c585a367580f8dd09d1"
last_active_commit = "6dc1698b988d1cc6f5d8b983af3ddd3ba65af86e"
evidence_paths = ["docs/adr/ADR-0008-reviewed-defect-closure-history.md", "docs/assurance/defect_closures/CS-SR-026.md"]
regression_tests = ["tests/test_governance_contract_schema.py", "tests/test_review_binding_certification.py"]
closure_evidence = "docs/assurance/defect_closures/CS-SR-026.md"

[[defects]]
id = "CS-SR-045"
severity = "P0"
area = "lawful-access-fact-authority"
root_cause = "Generic source preflight paths can construct an access profile whose login, captcha, robots, terms, paywall, and related restriction facts default to false without evidence that those facts were actually established, so an unknown restriction state can be treated as an affirmative lawful-access clearance."
discovered_against = "5f101b7bdddfd695904eb02144350e06207d9ded"
required_resolution = "Represent unknown access facts explicitly, require evidence-backed or reviewed access facts before live authority is granted, prohibit default-false restriction construction from satisfying lawful preflight, and add regressions for unknown login, captcha, robots, terms, and paywall states."
resolution_summary = "Made unknown access facts fail closed, required an affirmative reviewed-facts marker plus retained review basis before an otherwise unrestricted source can be allowed, preserved explicit restriction blocking, and proved SourceVerifier does not execute network transport without reviewed access authority."
resolution_commit = "e8fb0753be361bf909405cd0f452164e8912c817"
resolution_tree = "4394aa0d9f704b5b08da456d4d7b3523775df005"
last_active_commit = "d8397479da583db7d935f6eeaff1eeb47901b186"
evidence_paths = ["docs/assurance/defect_closures/CS-SR-045.md", "src/constructionsight/legal.py", "src/constructionsight/verification/source_verifier.py"]
regression_tests = ["tests/test_access_policy.py", "tests/test_adapter_base.py", "tests/test_source_verifier.py"]
closure_evidence = "docs/assurance/defect_closures/CS-SR-045.md"

[[defects]]
id = "CS-SR-049"
severity = "P0"
area = "duplicate-review-gate"
root_cause = "A lead classified as duplicate REVIEW_NEEDED can retain a READY workflow state because duplicate uncertainty is recorded only as a limitation, and the workflow transition matrix permits READY to ACTIVE without proving duplicate review has been resolved."
discovered_against = "5f101b7bdddfd695904eb02144350e06207d9ded"
required_resolution = "Make unresolved duplicate review a hard non-actionable workflow invariant, prohibit activation or outreach-relevant transitions while duplicate review remains unresolved, bind the transition check to durable duplicate-review state, and add READY, ACTIVE, and concurrent transition regressions."
resolution_summary = "Made unresolved duplicate review a hard durable non-actionable invariant across initial workflow creation, authorized transitions, direct persistence, fingerprint drift, and concurrent attempts; made persisted duplicate results immutable and retained dedicated mutation/regression witnesses."
resolution_commit = "ceea88953af6eb39a49717946934d7abe64b59b5"
resolution_tree = "5f69c77b9dbbbda9ef3baf0cf2415d0aaf204f6e"
last_active_commit = "059234e6ff5de2fc6e7ebfb7dbcfa5bd795ab3e5"
evidence_paths = ["docs/assurance/defect_closures/CS-SR-049.md", "src/constructionsight/lead_operator_service.py", "src/constructionsight/lead_workflow_models.py", "src/constructionsight/storage/lead_workflow_store.py"]
regression_tests = ["tests/test_lead_workflow_models.py", "tests/test_lead_workflow_service.py", "tests/test_lead_workflow_storage.py", "tests/test_lead_workflow_transition_authorization.py"]
closure_evidence = "docs/assurance/defect_closures/CS-SR-049.md"

[[defects]]
id = "CS-SR-052"
severity = "P1"
area = "result-ledger-content-identity"
root_cause = "Result ledger identity is derived from workflow, status, and revision without binding all semantically material outcome content, so materially different result records can share the same nominal ledger identifier."
discovered_against = "5f101b7bdddfd695904eb02144350e06207d9ded"
required_resolution = "Define canonical result-ledger serialization and a full content digest covering every material outcome field, bind authority events to that digest, keep revision or head identity separate from content identity, and add regressions proving any material mutation changes the content identity."
resolution_summary = "Added a canonical full-content SHA-256 digest across material result outcome fields, recomputed and validated it at model/history boundaries, separated revision identity from content identity, bound authority events to predecessor/current content digests, and added mutation/tamper regressions."
resolution_commit = "de1007dd04300b521b1b6ad5713b98ab82b11ddc"
resolution_tree = "a9c7c4f1a1d3221acb875550e0c82deff7df5d76"
last_active_commit = "4f3e45ef4fe35262f5ec89214933b4112d1c3def"
evidence_paths = ["docs/assurance/defect_closures/CS-SR-052.md", "src/constructionsight/result_authority_models.py", "src/constructionsight/result_authority_service.py", "src/constructionsight/result_ledger_models.py", "src/constructionsight/result_ledger_service.py"]
regression_tests = ["tests/test_result_authority_event_integrity.py", "tests/test_result_ledger_service.py"]
closure_evidence = "docs/assurance/defect_closures/CS-SR-052.md"

[[defects]]
id = "CS-SR-056"
severity = "P1"
area = "database-schema-evolution"
root_cause = "Database initialization relies on SQLAlchemy metadata create_all without a governed schema-version or migration mechanism, so existing databases can retain obsolete columns, constraints, or table shapes while current ORM models and certification assume a newer schema."
discovered_against = "5f101b7bdddfd695904eb02144350e06207d9ded"
required_resolution = "Introduce a deterministic repository-native schema version and migration or fail-closed compatibility mechanism, verify the persisted schema before application effects, provide explicit upgrade provenance, and add old-schema, partial-upgrade, wrong-version, and fresh-database regressions."
resolution_summary = "Added repository-owned schema version 1, canonical schema identity, fail-closed compatibility verification, provenance-bound adoption for exact unversioned schemas, no-mutation rejection for incompatible legacy schemas, and regression coverage for fresh, partial, wrong-version, and shape-drift states."
resolution_commit = "1866453b6cfcf63b6c0cd2af4cbb234daa59581f"
resolution_tree = "93e1e6893e33253adcf921e1739af8972638b4b6"
last_active_commit = "4f3e45ef4fe35262f5ec89214933b4112d1c3def"
evidence_paths = ["docs/architecture/database_schema_governance.md", "docs/assurance/defect_closures/CS-SR-056.md", "src/constructionsight/storage/database.py", "src/constructionsight/storage/schema_governance.py"]
regression_tests = ["tests/test_schema_governance.py"]
closure_evidence = "docs/assurance/defect_closures/CS-SR-056.md"

