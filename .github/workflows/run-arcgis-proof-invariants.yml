name: Run ArcGIS proof invariant hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: run-arcgis-proof-invariants
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/harden-arcgis-bulk-rehearsal-proof
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Execute canonical invariant patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/harden-arcgis-proof-invariants.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          step = lines.index("      - name: Enforce complete retry and timeline proof")
          run_line = next(
              index
              for index in range(step + 1, len(lines))
              if lines[index] == "        run: |"
          )
          end = next(
              index
              for index in range(run_line + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[run_line + 1 : end]
          )
          Path("/tmp/harden-arcgis-proof-invariants.sh").write_text(
              script + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          bash /tmp/harden-arcgis-proof-invariants.sh > /tmp/arcgis-proof-invariant-patch.log 2>&1
          status=$?
          set -e
          cat /tmp/arcgis-proof-invariant-patch.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/arcgis-proof-invariant-patch.log docs/audits/arcgis_proof_invariant_patch_diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/audits/arcgis_proof_invariant_patch_diagnostic.txt
            git commit -m "Record ArcGIS invariant patch diagnostic" || true
            git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
            exit "$status"
          fi

      - name: Remove temporary machinery and commit candidate
        run: |
          rm .github/workflows/harden-arcgis-proof-invariants.yml
          rm .github/workflows/run-arcgis-proof-invariants.yml
          rm docs/audits/arcgis_proof_invariant_trigger.txt
          rm -f docs/audits/arcgis_proof_invariant_patch_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce ArcGIS retry and timeline proof invariants"

      - name: Validate exact committed candidate
        run: |
          set +e
          {
            python -m pip check &&
            python -m ruff check src tests &&
            python -m mypy src &&
            python -m compileall -q src tests &&
            python -m pytest --strict-config --strict-markers -ra -W error &&
            constructionsight audit-adapters &&
            constructionsight audit-source-coverage data/source_registry.seed.json &&
            python -m constructionsight.repository_certification --root . --require-clean-worktree &&
            git diff --check
          } > /tmp/arcgis-proof-invariant-validation.log 2>&1
          status=$?
          set -e
          cat /tmp/arcgis-proof-invariant-validation.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/arcgis-proof-invariant-validation.log docs/audits/arcgis_proof_invariant_validation_diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/audits/arcgis_proof_invariant_validation_diagnostic.txt
            git commit -m "Record ArcGIS invariant validation diagnostic"
            git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
            exit "$status"
          fi

      - name: Push validated candidate
        run: git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
