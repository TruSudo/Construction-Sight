name: PR98 HTTPX response adapter

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch_pr98_httpx_response_adapter.py
      - .github/workflows/pr98-adapter-patch.yml

permissions:
  contents: write

jobs:
  apply-validate-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ceqanet-live-csv-proof-v3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Apply exact adapter patch
        run: python scripts/patch_pr98_httpx_response_adapter.py
      - name: Remove temporary tooling
        run: |
          git rm -f \
            scripts/patch_pr98_httpx_response_adapter.py \
            .github/workflows/pr98-adapter-patch.yml \
            .github/workflows/pr98-mypy-diagnostics.yml
      - name: Commit production candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Narrow CEQAnet CSV HTTPX response evidence"
      - name: Dependency integrity
        run: python -m pip check
      - name: Ruff
        run: python -m ruff check src tests
      - name: Capture mypy output
        run: python -m mypy src > /tmp/pr98-patched-mypy.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr98-patched-mypy-diagnostics
          path: /tmp/pr98-patched-mypy.txt
      - name: Mypy
        run: python -m mypy src
      - name: Compile
        run: python -m compileall -q src tests
      - name: Capture pytest output
        run: |
          python -m pytest --strict-config --strict-markers -ra -W error \
            > /tmp/pr98-patched-pytest.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr98-patched-pytest-diagnostics
          path: /tmp/pr98-patched-pytest.txt
      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error
      - name: Adapter audit
        run: constructionsight audit-adapters
      - name: Source coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json
      - name: Repository certification
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree
      - name: Diff hygiene
        run: git diff --check
      - name: Push production candidate
        run: git push origin HEAD:agent/ceqanet-live-csv-proof-v3
