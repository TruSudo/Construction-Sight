name: Apply Static Certification Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/silent-risk-certification'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact draft branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/silent-risk-certification
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/py311.lock

      - name: Install exact correction environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r requirements/py311.lock
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-build-isolation \
            -e .

      - name: Apply assertion-bound source corrections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_static_certification_fixes.py
          python scripts/apply_static_ruff_fixes.py
          python scripts/apply_dependency_action_scan_fix.py

      - name: Apply Ruff corrections
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m ruff check src tests --fix --unsafe-fixes
          python -m ruff check src tests --output-format=concise \
            > /tmp/static-ruff.txt 2>&1
          status=$?
          if [ ! -s /tmp/static-ruff.txt ]; then
            printf '%s\n' 'Ruff passed with no findings.' > /tmp/static-ruff.txt
          fi
          exit "${status}"

      - name: Publish Ruff diagnostic without source edits
        if: steps.ruff.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p governance/diagnostics
          cp /tmp/static-ruff.txt governance/diagnostics/static_ruff.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/diagnostics/static_ruff.txt
          git commit -m 'Retain static Ruff diagnostic'
          git push origin HEAD:agent/silent-risk-certification
          exit 1

      - name: Enforce Ruff result
        shell: bash
        run: test '${{ steps.ruff.outcome }}' = 'success'

      - name: Enforce mypy
        shell: bash
        run: python -m mypy src

      - name: Compile corrected tree
        shell: bash
        run: python -m compileall -q src tests scripts

      - name: Run focused static regressions
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --strict-config --strict-markers -W error -q \
            tests/test_supply_chain.py \
            tests/test_dependency_certification.py \
            tests/test_governance_contract_schema.py \
            tests/test_ceqanet_csv_live.py \
            tests/test_ceqanet_csv_evidence_series.py::test_socks_proxy_transport_is_declared_and_installed \
            > /tmp/static-regressions.txt 2>&1
          status=$?
          if [ ! -s /tmp/static-regressions.txt ]; then
            printf '%s\n' 'Focused regressions passed with no output.' > /tmp/static-regressions.txt
          fi
          exit "${status}"

      - name: Publish regression diagnostic without source edits
        if: steps.regressions.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p governance/diagnostics
          cp /tmp/static-regressions.txt governance/diagnostics/static_regressions.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/diagnostics/static_regressions.txt
          git commit -m 'Retain static regression diagnostic'
          git push origin HEAD:agent/silent-risk-certification
          exit 1

      - name: Enforce focused regressions
        shell: bash
        run: test '${{ steps.regressions.outcome }}' = 'success'

      - name: Exercise corrected mutation overlay
        id: mutation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m constructionsight.mutation_certification \
            --root . \
            --output /tmp/mutation-after-static-fixes.json

      - name: Commit exact correction result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'Static correction script produced no changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Apply exact-head static certification fixes'
          git push origin HEAD:agent/silent-risk-certification
