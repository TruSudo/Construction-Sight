name: Revert Broad Formatting Commit

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  revert:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/silent-risk-certification'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact draft branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/silent-risk-certification
          fetch-depth: 0
          persist-credentials: true

      - name: Verify target ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            59759d545f243e67fdfa284ced34a66e36090f59 \
            HEAD

      - name: Create exact revert commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 59759d545f243e67fdfa284ced34a66e36090f59

      - name: Check revert diff hygiene
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Push exact revert commit
        shell: bash
        run: git push origin HEAD:agent/silent-risk-certification
