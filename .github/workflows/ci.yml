name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check

  repair-arcgis-proof-indentation:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/harden-arcgis-bulk-rehearsal-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/harden-arcgis-bulk-rehearsal-proof
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Repair generated Python blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          bulk_path = Path("src/constructionsight/parcel_source_bulk_rehearsal_models.py")
          bulk = bulk_path.read_text(encoding="utf-8")
          bulk_start = bulk.index(
              "        if self.resume.resumed_at < checkpoint.created_at:\n"
          )
          bulk_end = bulk.index(
              '        payload = self.model_dump(mode="json", exclude={"evidence_id"})\n',
              bulk_start,
          )
          bulk_lines = [
              "        if self.resume.resumed_at < checkpoint.created_at:",
              "            raise ValueError(\"ArcGIS resume cannot precede checkpoint creation\")",
              "        if first_resumed_page.observed_at < self.resume.resumed_at:",
              "            raise ValueError(\"ArcGIS resumed page cannot precede the resume event\")",
              "",
              "        retry_page_ids = tuple(event.page_evidence_id for event in self.retry_events)",
              "        expected_retry_page_ids = tuple(",
              "            sorted(",
              "                page.page_evidence_id",
              "                for page in pages",
              "                if page.attempt_count > 1",
              "            )",
              "        )",
              "        if retry_page_ids != expected_retry_page_ids:",
              "            raise ValueError(",
              "                \"ArcGIS retry evidence must cover every and only retried page\"",
              "            )",
              "        pages_by_id = {page.page_evidence_id: page for page in pages}",
              "        for event in self.retry_events:",
              "            page = pages_by_id.get(event.page_evidence_id)",
              "            if page is None:",
              "                raise ValueError(\"ArcGIS retry evidence references an unknown page\")",
              "            if page.attempt_count != event.recovered_attempt_number:",
              "                raise ValueError(\"ArcGIS retry attempts do not match page evidence\")",
              "            if page.response_digest != event.recovered_response_digest:",
              "                raise ValueError(\"ArcGIS retry response digest does not match recovered page\")",
              "            if event.recorded_at > page.observed_at:",
              "                raise ValueError(\"ArcGIS retry record cannot follow its recovered page\")",
              "",
              "        latest_evidence_time = max(",
              "            self.resume.resumed_at,",
              "            checkpoint.created_at,",
              "            *(page.observed_at for page in pages),",
              "            *(event.recorded_at for event in self.retry_events),",
              "        )",
              "        if self.created_at < latest_evidence_time:",
              "            raise ValueError(\"ArcGIS rehearsal evidence cannot predate its proof records\")",
              "",
          ]
          bulk_path.write_text(
              bulk[:bulk_start] + "\n".join(bulk_lines) + "\n" + bulk[bulk_end:],
              encoding="utf-8",
          )

          manifest_path = Path("src/constructionsight/parcel_source_acquisition_models.py")
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest_start = manifest.index("        evidence = self.rehearsal_evidence\n")
          manifest_end = manifest.index(
              "        if (\n            evidence.snapshot_id != self.snapshot_id",
              manifest_start,
          )
          manifest_lines = [
              "        evidence = self.rehearsal_evidence",
              "        evidence_times = (",
              "            evidence.created_at,",
              "            evidence.checkpoint.created_at,",
              "            evidence.resume.resumed_at,",
              "            *(page.observed_at for page in evidence.page_evidence),",
              "            *(event.recorded_at for event in evidence.retry_events),",
              "        )",
              "        if any(",
              "            timestamp < self.started_at or timestamp > self.completed_at",
              "            for timestamp in evidence_times",
              "        ):",
              "            raise ValueError(",
              "                \"ArcGIS bulk rehearsal evidence falls outside the manifest execution window\"",
              "            )",
          ]
          manifest_path.write_text(
              manifest[:manifest_start]
              + "\n".join(manifest_lines)
              + "\n"
              + manifest[manifest_end:],
              encoding="utf-8",
          )
          PY

      - name: Restore canonical CI and commit repair
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm docs/audits/arcgis_proof_invariant_validation_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair ArcGIS proof invariant formatting"

      - name: Validate exact committed candidate
        run: |
          set +e
          {
            python -m pip check &&
            python -m ruff check src tests &&
            python -m mypy src &&
            python -m compileall -q src tests &&
            python -m pytest --strict-config --strict-markers -ra -W error &&
            constructionsight audit-adapters &&
            constructionsight audit-source-coverage data/source_registry.seed.json &&
            python -m constructionsight.repository_certification --root . --require-clean-worktree &&
            git diff --check
          } > /tmp/arcgis-proof-repair-validation.log 2>&1
          status=$?
          set -e
          cat /tmp/arcgis-proof-repair-validation.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/arcgis-proof-repair-validation.log docs/audits/arcgis_proof_repair_validation_diagnostic.txt
            git add docs/audits/arcgis_proof_repair_validation_diagnostic.txt
            git commit -m "Record ArcGIS proof repair diagnostic"
            git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
            exit "$status"
          fi

      - name: Push validated candidate
        run: git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
