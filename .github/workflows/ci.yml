name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Capture Ruff diagnostics
        run: python -m ruff check src tests --output-format=json > /tmp/ruff-results-${{ matrix.python-version }}.json || true

      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ruff-results-${{ matrix.python-version }}
          path: /tmp/ruff-results-${{ matrix.python-version }}.json

      - name: Ruff
        run: python -m ruff check src tests

      - name: Capture mypy diagnostics
        run: python -m mypy src > /tmp/mypy-results-${{ matrix.python-version }}.txt 2>&1 || true

      - name: Upload mypy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mypy-results-${{ matrix.python-version }}
          path: /tmp/mypy-results-${{ matrix.python-version }}.txt

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check
