name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check

  reconcile-pr116-docs:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/add-arcgis-live-rehearsal-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-live-rehearsal-authorization
          fetch-depth: 0

      - name: Reconcile canonical ledgers
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_line(path: str, prefix: str, replacement: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              matches = [index for index, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: prefix {prefix!r} matched {len(matches)} lines")
              lines[matches[0]:matches[0] + 1] = replacement.splitlines()
              target.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def insert_after_line(path: str, prefix: str, line: str, marker: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              if any(marker in item for item in lines):
                  return
              matches = [index for index, item in enumerate(lines) if item.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: prefix {prefix!r} matched {len(matches)} lines")
              lines.insert(matches[0] + 1, line)
              target.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def insert_before_heading(path: str, heading: str, block: str, marker: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              needle = f"{heading}\n"
              if text.count(needle) != 1:
                  raise SystemExit(f"{path}: heading {heading!r} did not match once")
              target.write_text(text.replace(needle, block + "\n" + needle, 1), encoding="utf-8")

          insert_after_line(
              "README.md",
              "- Self-contained complete-rehearsal proof bundles",
              "- Expiring single-use ArcGIS live-rehearsal authorization and offline preflight bound to one exact plan, with import, promotion, recurring, credential, bypass, and production-bulk authority fixed false",
              "Expiring single-use ArcGIS live-rehearsal authorization",
          )
          replace_line(
              "README.md",
              "The parcel-source verification layer binds the official San Bernardino and Riverside",
              "The parcel-source verification layer binds the official San Bernardino and Riverside public parcel endpoints and observed schemas to immutable evidence, proposition-specific authority, source-scope county/state constants, and an explicit county coverage-gap report. The additive ArcGIS acquisition layer binds exact capability metadata, safe four-request probe plans, executed observations, complete-rehearsal manifests, and explicit maturity assessments. It includes a reusable read-only complete-rehearsal executor, exact-response HTTP adapter, and self-contained portable proof bundle with independent offline recomputation. An expiring single-use authorization and offline preflight now bind any future live rehearsal to one exact snapshot and plan, a maximum 24-hour window, one execution, two count requests, mandatory response/checkpoint/bundle retention, and preserved false authority for credentials, bypass, import, promotion, recurrence, and production bulk collection. No county authorization artifact has been issued or committed, no durable consumption ledger or live execution command exists, and no live county complete rehearsal has been performed. Canonical 2026-07-14 evidence records both official sources as `bounded_query_verified`: San Bernardino reported 839,794 records and Riverside reported 846,251 records, and each exact four-observation bundle independently verifies and passed exact-ID transactional persistence. Neither source is import-ready, bulk-rehearsal-verified, profile-promoted, or bulk-authorized.",
          )

          replace_line(
              "docs/architecture/current_implementation_status.md",
              "| Parcel ArcGIS acquisition gates |",
              "| Parcel ArcGIS acquisition gates | Yes | Yes | Yes | Yes | Yes | Bounded on demand | Exact capability snapshots, retained bounded proofs, a complete-rehearsal executor, official HTTP adapter, and portable independently verifiable proof bundle exist. An exact-plan, maximum-24-hour, single-use authorization and offline preflight now guard eligibility for one future live rehearsal while fixing credential, bypass, import, promotion, recurring, and production-bulk authority false. No authorization artifact, durable consumption ledger, live county command, or live county rehearsal exists. |",
          )
          replace_line(
              "docs/architecture/current_implementation_status.md",
              "| CS-PLAN-008 | Countywide parcel evidence ingestion |",
              "| CS-PLAN-008 | Countywide parcel evidence ingestion | Exact metadata, retained bounded proofs, an exact-response executor, official HTTP adapter, portable proof bundle, and an exact-plan expiring single-use authorization/preflight contract exist. Both sources remain `bounded_query_verified`; no authorization has been issued and no consumption ledger or live rehearsal exists. | Implement append-only authorization-consumption evidence; separately issue and consume one authorization per county; execute, save, and independently verify each portable rehearsal bundle; then review profile promotion and recurring observation orchestration as distinct later phases. |",
          )

          insert_before_heading(
              "docs/architecture/parcel_arcgis_acquisition.md",
              "## Portable verification and explicit persistence",
              "## Live-rehearsal authorization and preflight\n\n`ParcelArcGISBulkRehearsalAuthorization` separates implemented capability from permission to use it. Issuance requires an explicit caller decision and binds the exact snapshot, profile, rehearsal plan, source, county, HTTPS query endpoint, object-ID field, page/checkpoint/retry policy, execution nonce, issuer, reason, and a window of no more than 24 hours. Authority is limited to one execution, two count requests, GET-only geometry-disabled access, and mandatory exact-response, checkpoint, portable-bundle, and independent-verification retention. Credential use, access-control bypass, parcel import, profile promotion, recurring execution, and production bulk collection are fixed false.\n\nOffline preflight requires the exact expected authorization identity, matching snapshot and plan, a current not-before/expiration window, and an authorization identity absent from a caller-supplied consumed-ID set. No authorization artifact or durable consumption ledger is committed in this phase, and no live command consumes the authorization. Before live execution, a later phase must atomically append consumption evidence binding authorization, preflight, execution, portable bundle, and independent verification identities. See `parcel_arcgis_rehearsal_authorization.md`.\n",
              "## Live-rehearsal authorization and preflight",
          )
          replace_line(
              "docs/architecture/parcel_arcgis_acquisition.md",
              "The read-only upstream operator exposes all six record kinds",
              "The read-only upstream operator exposes all six record kinds with applicable source, county, and status filters. The parcel-source CLI exposes canonical metadata snapshots, bounded plans, current assessments, the explicit live bounded probe command, offline bounded-bundle verification, and explicitly authorized persistence. The complete-rehearsal executor, HTTP adapter, portable proof bundle, authorization builder, and preflight service remain service/test boundaries; no issued authorization, consumption ledger, or live county rehearsal command exists.",
          )
          replace_line(
              "docs/architecture/parcel_arcgis_acquisition.md",
              "| San Bernardino County parcel FeatureServer layer |",
              "| San Bernardino County parcel FeatureServer layer | 1,000 | 839,794 | `bounded_query_verified` | Durable authorization consumption, issued exact-plan authorization, live rehearsal, and independent saved-bundle verification |",
          )
          replace_line(
              "docs/architecture/parcel_arcgis_acquisition.md",
              "| Riverside County Assessor MapServer layer |",
              "| Riverside County Assessor MapServer layer | 2,000 | 846,251 | `bounded_query_verified` | Durable authorization consumption, issued exact-plan authorization, live rehearsal, and independent saved-bundle verification |",
          )
          replace_line(
              "docs/architecture/parcel_arcgis_acquisition.md",
              "Both retained bounded-proof bundles independently recompute their metadata",
              "Both retained bounded-proof bundles independently recompute their metadata, plans, response digests, replay agreement, and assessments. The complete-rehearsal executor, exact-byte store, HTTP adapter, portable verifier, and single-use authorization/preflight contract now pass deterministic tests, but no authorization artifact has been issued, no durable consumption ledger exists, and neither official county source has undergone a live complete rehearsal. Neither source is bulk-rehearsal-verified, profile-promoted, bulk-authorized, or import-ready.",
          )

          replace_line(
              "docs/audits/full_repo_audit_inventory.md",
              "- digest-bound ArcGIS capability,",
              "- digest-bound ArcGIS capability, retained county bounded proofs, exact-response rehearsal execution and HTTP planning, portable independent verification, and expiring single-use exact-plan authorization/preflight with downstream authority fixed false;",
          )
          replace_line(
              "docs/audits/full_repo_audit_inventory.md",
              "| Parcel ArcGIS acquisition gates | Yes | Yes |",
              "| Parcel ArcGIS acquisition gates | Yes | Yes | Yes | Yes | Read-only plus explicit bounded probe and guarded proof persistence | Bounded on demand | Retained county bundles remain `bounded_query_verified`. The executor, HTTP adapter, portable verifier, and exact-plan single-use authorization/preflight contract exist, but no authorization artifact, durable consumption ledger, live county rehearsal, import, profile promotion, recurring authority, or production bulk run exists. |",
          )
          replace_line(
              "docs/audits/full_repo_audit_inventory.md",
              "| CS-PLAN-008 | Countywide parcel evidence ingestion |",
              "| CS-PLAN-008 | Countywide parcel evidence ingestion | Exact metadata, bounded proofs, executor, HTTP adapter, portable verifier, and expiring exact-plan single-use authorization/preflight exist. Both sources remain `bounded_query_verified`; no authorization has been issued or consumed. | Implement append-only consumption evidence, then separately issue, consume, execute, save, and independently verify one live rehearsal per county before any promotion or recurring orchestration review. |",
          )
          PY

      - name: Restore canonical CI and publish reconciliation
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f docs/audits/pr116_docs_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile ArcGIS rehearsal authorization documentation"
          git push origin HEAD:agent/add-arcgis-live-rehearsal-authorization
