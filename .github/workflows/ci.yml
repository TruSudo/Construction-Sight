name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests --output-format=json > ruff-results.json

      - name: Upload Ruff results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-results-${{ matrix.python-version }}
          path: ruff-results.json
          if-no-files-found: error
          retention-days: 1

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: |
          python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json
