name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check

  arcgis-proof-invariant-hardening:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/harden-arcgis-bulk-rehearsal-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/harden-arcgis-bulk-rehearsal-proof
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Execute structural invariant patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/run-arcgis-proof-invariants.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          step = lines.index("      - name: Execute structural invariant patch")
          run_line = next(
              index
              for index in range(step + 1, len(lines))
              if lines[index] == "        run: |"
          )
          end = next(
              index
              for index in range(run_line + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[run_line + 1 : end]
          )
          Path("/tmp/arcgis-proof-invariant-patch.sh").write_text(
              script + "\n",
              encoding="utf-8",
          )
          PY
          bash /tmp/arcgis-proof-invariant-patch.sh

      - name: Restore canonical CI and remove temporary machinery
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/harden-arcgis-proof-invariants.yml
          rm .github/workflows/run-arcgis-proof-invariants.yml
          rm docs/audits/arcgis_proof_invariant_trigger.txt
          rm -f docs/audits/arcgis_proof_invariant_patch_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce ArcGIS retry and timeline proof invariants"

      - name: Validate exact committed candidate
        run: |
          set +e
          {
            python -m pip check &&
            python -m ruff check src tests &&
            python -m mypy src &&
            python -m compileall -q src tests &&
            python -m pytest --strict-config --strict-markers -ra -W error &&
            constructionsight audit-adapters &&
            constructionsight audit-source-coverage data/source_registry.seed.json &&
            python -m constructionsight.repository_certification --root . --require-clean-worktree &&
            git diff --check
          } > /tmp/arcgis-proof-invariant-validation.log 2>&1
          status=$?
          set -e
          cat /tmp/arcgis-proof-invariant-validation.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/arcgis-proof-invariant-validation.log docs/audits/arcgis_proof_invariant_validation_diagnostic.txt
            git add docs/audits/arcgis_proof_invariant_validation_diagnostic.txt
            git commit -m "Record ArcGIS invariant validation diagnostic"
            git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
            exit "$status"
          fi

      - name: Push validated candidate
        run: git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
