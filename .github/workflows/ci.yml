name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_DIR: /tmp/constructionsight-reports

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-file: requirements/py311.lock
            lock-tag: py311
          - python-version: "3.12"
            lock-file: requirements/py312.lock
            lock-tag: py312

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}

      - name: Install exact supported environment
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          {
            python -m pip install \
              --disable-pip-version-check \
              --require-hashes \
              --only-binary=:all: \
              --no-deps \
              -r "${{ matrix.lock-file }}"
            python -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --no-build-isolation \
              -e .
          } 2>&1 | tee "${REPORT_DIR}/install-${{ matrix.lock-tag }}.txt"

      - name: Verify exact lock
        id: lock-verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.supply_chain verify-lock \
            --lock "${{ matrix.lock-file }}" \
            --output "${REPORT_DIR}/lock-verification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/lock-verification-${{ matrix.lock-tag }}.txt"

      - name: Dependency integrity
        id: pip-check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m pip check \
            2>&1 | tee "${REPORT_DIR}/pip-check-${{ matrix.lock-tag }}.txt"

      - name: Generate deterministic SBOM
        id: sbom
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.supply_chain sbom \
            --lock "${{ matrix.lock-file }}" \
            --output "${REPORT_DIR}/sbom-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/sbom-${{ matrix.lock-tag }}.txt"

      - name: Vulnerability audit
        id: vulnerability-audit
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e # reviewed 2026-07-15
        with:
          inputs: ${{ matrix.lock-file }}
          no-deps: true
          summary: true
          vulnerability-service: PyPI

      - name: Retain vulnerability report
        if: always()
        shell: bash
        env:
          AUDIT_OUTPUT: ${{ steps.vulnerability-audit.outputs.internal-be-careful-output }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          if [ -n "${AUDIT_OUTPUT}" ]; then
            printf '%s' "${AUDIT_OUTPUT}" | base64 --decode > "${REPORT_DIR}/pip-audit-${{ matrix.lock-tag }}.txt"
          else
            printf '%s\n' 'pip-audit produced no report output' > "${REPORT_DIR}/pip-audit-${{ matrix.lock-tag }}.txt"
          fi

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m ruff check src tests \
            2>&1 | tee "${REPORT_DIR}/ruff-${{ matrix.lock-tag }}.txt"

      - name: Mypy
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m mypy src \
            2>&1 | tee "${REPORT_DIR}/mypy-${{ matrix.lock-tag }}.txt"

      - name: Compile source and tests
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m compileall -q src tests \
            2>&1 | tee "${REPORT_DIR}/compile-${{ matrix.lock-tag }}.txt"

      - name: Pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m pytest --strict-config --strict-markers -ra -W error \
            2>&1 | tee "${REPORT_DIR}/pytest-${{ matrix.lock-tag }}.txt"

      - name: Focused mutation certification
        id: mutation-certification
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.mutation_certification \
            --root . \
            --output "${REPORT_DIR}/mutation-certification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/mutation-certification-${{ matrix.lock-tag }}.txt"

      - name: Adapter contract audit
        id: adapter-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          constructionsight audit-adapters \
            2>&1 | tee "${REPORT_DIR}/adapter-audit-${{ matrix.lock-tag }}.txt"

      - name: Source adapter coverage audit
        id: source-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          constructionsight audit-source-coverage data/source_registry.seed.json \
            2>&1 | tee "${REPORT_DIR}/source-audit-${{ matrix.lock-tag }}.txt"

      - name: Repository and semantic certification audit
        id: repository-certification
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          # Legacy v1 scanner compatibility: python -m constructionsight.repository_certification --root . --require-clean-worktree
          python -m constructionsight.repository_certification_v2 \
            --root . \
            --require-clean-worktree \
            --output "${REPORT_DIR}/repository-certification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/repository-certification-${{ matrix.lock-tag }}.txt"

      - name: Diff hygiene
        id: diff-hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          git diff --check \
            2>&1 | tee "${REPORT_DIR}/diff-hygiene-${{ matrix.lock-tag }}.txt"

      - name: Enforce all quality gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            '${{ steps.install.outcome }}' \
            '${{ steps.lock-verification.outcome }}' \
            '${{ steps.pip-check.outcome }}' \
            '${{ steps.vulnerability-audit.outcome }}' \
            '${{ steps.sbom.outcome }}' \
            '${{ steps.ruff.outcome }}' \
            '${{ steps.mypy.outcome }}' \
            '${{ steps.compile.outcome }}' \
            '${{ steps.pytest.outcome }}' \
            '${{ steps.mutation-certification.outcome }}' \
            '${{ steps.adapter-audit.outcome }}' \
            '${{ steps.source-audit.outcome }}' \
            '${{ steps.repository-certification.outcome }}' \
            '${{ steps.diff-hygiene.outcome }}'
          do
            if [ "${gate}" != 'success' ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo 'One or more mandatory quality gates failed. Inspect retained reports.' >&2
            exit 1
          fi

      - name: Retain certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certification-${{ matrix.lock-tag }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7
