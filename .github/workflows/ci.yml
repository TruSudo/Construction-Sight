name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/py${{ matrix.python-version == '3.11' && '311' || '312' }}.lock

      - name: Install exact supported environment
        shell: bash
        run: |
          set -euo pipefail
          tag="$(printf '%s' '${{ matrix.python-version }}' | tr -d '.')"
          lock="requirements/py${tag}.lock"
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check --no-deps -r "${lock}"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Verify exact lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          tag="$(printf '%s' '${{ matrix.python-version }}' | tr -d '.')"
          python -m constructionsight.supply_chain verify-lock \
            --lock "requirements/py${tag}.lock" \
            --output "reports/lock-verification-py${tag}.json"

      - name: Dependency integrity
        run: python -m pip check

      - name: Vulnerability audit
        id: vulnerability-audit
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e # reviewed 2026-07-15
        with:
          inputs: requirements/py${{ matrix.python-version == '3.11' && '311' || '312' }}.lock
          no-deps: true
          summary: true
          vulnerability-service: PyPI

      - name: Retain vulnerability report
        if: always()
        shell: bash
        env:
          AUDIT_OUTPUT: ${{ steps.vulnerability-audit.outputs.internal-be-careful-output }}
        run: |
          set -euo pipefail
          mkdir -p reports
          tag="$(printf '%s' '${{ matrix.python-version }}' | tr -d '.')"
          if [ -n "${AUDIT_OUTPUT}" ]; then
            printf '%s' "${AUDIT_OUTPUT}" | base64 --decode > "reports/pip-audit-py${tag}.txt"
          else
            printf '%s\n' 'pip-audit produced no report output' > "reports/pip-audit-py${tag}.txt"
          fi

      - name: Enforce vulnerability result
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.vulnerability-audit.outcome }}' != 'success' ]; then
            echo 'Exact-environment vulnerability audit failed or found a vulnerability.' >&2
            exit 1
          fi

      - name: Generate deterministic SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          tag="$(printf '%s' '${{ matrix.python-version }}' | tr -d '.')"
          python -m constructionsight.supply_chain sbom \
            --lock "requirements/py${tag}.lock" \
            --output "reports/sbom-py${tag}.json"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository and semantic certification audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          tag="$(printf '%s' '${{ matrix.python-version }}' | tr -d '.')"
          python -m constructionsight.repository_certification_v2 \
            --root . \
            --require-clean-worktree \
            --output "reports/repository-certification-py${tag}.json"

      - name: Diff hygiene
        run: git diff --check

      - name: Retain certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certification-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
