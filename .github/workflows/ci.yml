name: CI

on:
  push:
    branches:
      - agent/add-arcgis-rehearsal-proof-bundle

permissions:
  contents: write

jobs:
  patch-pr115-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-rehearsal-proof-bundle
          fetch-depth: 0

      - name: Bind proof chronology and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path("src/constructionsight/parcel_source_bulk_rehearsal_bundle_models.py")
          text = models.read_text(encoding="utf-8")
          old = '''        if self.bulk_run_authorized:
            raise ValueError("ArcGIS rehearsal proof bundle cannot authorize a bulk run")
        scope = (self.source_key, self.county)
'''
          new = '''        if self.bulk_run_authorized:
            raise ValueError("ArcGIS rehearsal proof bundle cannot authorize a bulk run")
        if self.created_at < self.manifest.completed_at:
            raise ValueError(
                "ArcGIS rehearsal proof bundle created_at cannot precede manifest completion"
            )
        scope = (self.source_key, self.county)
'''
          if text.count(old) != 1:
              raise SystemExit("bundle chronology insertion point did not match exactly once")
          models.write_text(text.replace(old, new, 1), encoding="utf-8")

          service = Path("src/constructionsight/parcel_source_bulk_rehearsal_bundle.py")
          text = service.read_text(encoding="utf-8")
          old = '''    """Reparse every exact body and rebuild all derived proof without network access."""

    rebuilt_plan = build_arcgis_bulk_rehearsal_plan(
'''
          new = '''    """Reparse every exact body and rebuild all derived proof without network access."""

    effective_verified_at = verified_at or datetime.now(UTC)
    if effective_verified_at < bundle.created_at:
        raise ValueError(
            "ArcGIS rehearsal proof verification time cannot precede bundle creation"
        )
    rebuilt_plan = build_arcgis_bulk_rehearsal_plan(
'''
          if text.count(old) != 1:
              raise SystemExit("verification chronology insertion point did not match once")
          text = text.replace(old, new, 1)
          old = "        verified_at=verified_at or datetime.now(UTC),\n"
          new = "        verified_at=effective_verified_at,\n"
          if text.count(old) != 1:
              raise SystemExit("verification timestamp assignment did not match once")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_parcel_source_bulk_rehearsal_bundle.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_bundle_binds_creation_and_verification_chronology"
          if marker not in text:
              text += '''


def test_bundle_binds_creation_and_verification_chronology(tmp_path: Path) -> None:
    snapshot, plan, execution, artifact_store = _completed_rehearsal(tmp_path)

    with pytest.raises(ValueError, match="created_at cannot precede"):
        build_arcgis_bulk_rehearsal_proof_bundle(
            snapshot,
            plan,
            execution,
            artifact_store,
            created_at=execution.manifest.completed_at - timedelta(seconds=1),
        )

    bundle = build_arcgis_bulk_rehearsal_proof_bundle(
        snapshot,
        plan,
        execution,
        artifact_store,
        created_at=execution.manifest.completed_at + timedelta(seconds=1),
    )
    with pytest.raises(ValueError, match="verification time cannot precede"):
        verify_arcgis_bulk_rehearsal_proof_bundle(
            bundle,
            verified_at=bundle.created_at - timedelta(seconds=1),
        )
'''
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Restore canonical CI and publish chronology patch
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f docs/audits/pr115_chronology_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind ArcGIS rehearsal proof chronology"
          git push origin HEAD:agent/add-arcgis-rehearsal-proof-bundle
