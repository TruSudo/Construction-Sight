name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
      - name: Install application and developer dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' pip-audit==2.10.1
      - name: Dependency integrity
        run: python -m pip check
      - name: Ruff
        run: python -m ruff check src tests
      - name: Strict Mypy
        run: python -m mypy src/constructionsight
      - name: JavaScript syntax
        run: find src tests -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Full regression suite
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: |
          python -m pip list --format=freeze --exclude constructionsight > /tmp/dependency-audit.txt
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r /tmp/dependency-audit.txt
