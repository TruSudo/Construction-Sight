name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check

  diagnose-pr114-tests:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/add-arcgis-rehearsal-http-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-rehearsal-http-adapter
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Capture first targeted failure
        run: |
          set +e
          python -m pytest --strict-config --strict-markers -vv -x -W error \
            tests/test_parcel_source_bulk_rehearsal_http.py \
            > /tmp/pr114-test-diagnostic.txt 2>&1
          status=$?
          set -e
          sed 's/[[:space:]]*$//' /tmp/pr114-test-diagnostic.txt \
            > docs/audits/pr114_test_diagnostic.txt
          echo "" >> docs/audits/pr114_test_diagnostic.txt
          echo "exit_status=$status" >> docs/audits/pr114_test_diagnostic.txt

      - name: Restore canonical CI and publish diagnostic
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f docs/audits/pr114_diagnostic_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture PR114 targeted test diagnostic"
          git push origin HEAD:agent/add-arcgis-rehearsal-http-adapter
