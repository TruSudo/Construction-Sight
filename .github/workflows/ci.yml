name: CI

on:
  push:
    branches:
      - agent/add-arcgis-rehearsal-proof-bundle

permissions:
  contents: write

jobs:
  diagnose-pr115-mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-rehearsal-proof-bundle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Capture strict mypy errors
        run: |
          set +e
          python -m mypy src --no-pretty --show-error-codes \
            > /tmp/pr115-mypy.txt 2>&1
          status=$?
          set -e
          sed 's/[[:space:]]*$//' /tmp/pr115-mypy.txt \
            > docs/audits/pr115_mypy_diagnostic.txt
          echo "" >> docs/audits/pr115_mypy_diagnostic.txt
          echo "exit_status=$status" >> docs/audits/pr115_mypy_diagnostic.txt

      - name: Restore canonical CI and publish diagnostic
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f docs/audits/pr115_mypy_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture PR115 mypy diagnostic"
          git push origin HEAD:agent/add-arcgis-rehearsal-proof-bundle
