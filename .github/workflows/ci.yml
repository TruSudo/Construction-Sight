name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REPORT_DIR: /tmp/constructionsight-reports

jobs:
  vulnerability:
    name: Python ${{ matrix.python-version }} isolated vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-file: requirements/py311.lock
            lock-tag: py311
          - python-version: "3.12"
            lock-file: requirements/py312.lock
            lock-tag: py312

    steps:
      - name: Check out exact repository candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject tracked symbolic links
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --stage | grep -q '^120000 '; then
            git ls-files --stage | grep '^120000 ' >&2
            exit 1
          fi

      - name: Set up isolated audit interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Vulnerability audit
        id: vulnerability-audit
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e # reviewed 2026-07-15
        with:
          inputs: ${{ matrix.lock-file }}
          no-deps: true
          summary: true
          vulnerability-service: PyPI

      - name: Retain vulnerability report
        if: always()
        shell: bash
        env:
          AUDIT_OUTPUT: ${{ steps.vulnerability-audit.outputs.internal-be-careful-output }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          if [ -n "${AUDIT_OUTPUT}" ]; then
            printf '%s' "${AUDIT_OUTPUT}" | base64 --decode > "${REPORT_DIR}/pip-audit-${{ matrix.lock-tag }}.txt"
          else
            printf '%s\n' 'pip-audit produced no report output' > "${REPORT_DIR}/pip-audit-${{ matrix.lock-tag }}.txt"
          fi

      - name: Enforce vulnerability audit
        if: always()
        shell: bash
        run: test '${{ steps.vulnerability-audit.outcome }}' = 'success'

      - name: Retain vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-${{ matrix.lock-tag }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-file: requirements/py311.lock
            lock-tag: py311
          - python-version: "3.12"
            lock-file: requirements/py312.lock
            lock-tag: py312

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Resolution ancestry certification requires the complete reviewed history.
          fetch-depth: 0

      - name: Verify exact checkout
        id: checkout-identity
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "${EXPECTED_SHA}" "${actual}" \
            | tee "${REPORT_DIR}/checkout-identity-${{ matrix.lock-tag }}.txt"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Reject tracked symbolic links
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --stage | grep -q '^120000 '; then
            git ls-files --stage | grep '^120000 ' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}

      - name: Install exact supported environment
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          {
            python -m pip install \
              --disable-pip-version-check \
              --require-hashes \
              --only-binary=:all: \
              --no-deps \
              -r "${{ matrix.lock-file }}"
            python -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --no-build-isolation \
              -e .
          } 2>&1 | tee "${REPORT_DIR}/install-${{ matrix.lock-tag }}.txt"

      - name: Verify exact lock
        id: lock-verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.supply_chain verify-lock \
            --lock "${{ matrix.lock-file }}" \
            --output "${REPORT_DIR}/lock-verification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/lock-verification-${{ matrix.lock-tag }}.txt"

      - name: Dependency integrity
        id: pip-check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m pip check \
            2>&1 | tee "${REPORT_DIR}/pip-check-${{ matrix.lock-tag }}.txt"

      - name: Generate deterministic SBOM
        id: sbom
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.supply_chain sbom \
            --lock "${{ matrix.lock-file }}" \
            --output "${REPORT_DIR}/sbom-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/sbom-${{ matrix.lock-tag }}.txt"

      - name: Verify pre-gate exact environment identity
        id: pre-gate-lock-verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.supply_chain verify-lock \
            --lock "${{ matrix.lock-file }}" \
            --output "${REPORT_DIR}/pre-gate-lock-verification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/pre-gate-lock-verification-${{ matrix.lock-tag }}.txt"

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m ruff check src tests \
            2>&1 | tee "${REPORT_DIR}/ruff-${{ matrix.lock-tag }}.txt"

      - name: Mypy
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m mypy src \
            2>&1 | tee "${REPORT_DIR}/mypy-${{ matrix.lock-tag }}.txt"

      - name: Compile source and tests
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m compileall -q src tests \
            2>&1 | tee "${REPORT_DIR}/compile-${{ matrix.lock-tag }}.txt"

      - name: Pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m pytest --strict-config --strict-markers -ra -W error \
            2>&1 | tee "${REPORT_DIR}/pytest-${{ matrix.lock-tag }}.txt"

      - name: Focused mutation certification
        id: mutation-certification
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.mutation_certification \
            --root . \
            --output "${REPORT_DIR}/mutation-certification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/mutation-certification-${{ matrix.lock-tag }}.txt"

      - name: Adapter contract audit
        id: adapter-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          constructionsight audit-adapters \
            2>&1 | tee "${REPORT_DIR}/adapter-audit-${{ matrix.lock-tag }}.txt"

      - name: Source adapter coverage audit
        id: source-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          constructionsight audit-source-coverage data/source_registry.seed.json \
            2>&1 | tee "${REPORT_DIR}/source-audit-${{ matrix.lock-tag }}.txt"

      - name: Native assurance preflight certification
        id: assurance-preflight
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.assurance_preflight_certification \
            --root . \
            --output "${REPORT_DIR}/assurance-preflight-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/assurance-preflight-${{ matrix.lock-tag }}.txt"

      - name: Verify optional independent human GitHub review
        id: github-review
        continue-on-error: true
        shell: bash
        env:
          GITHUB_API_ROOT: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          LOCK_TAG: ${{ matrix.lock-tag }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          review_artifact='governance/reviews/assurance_review.json'
          if [ ! -f "${review_artifact}" ]; then
            printf '%s\n' \
              'Assurance artifact absent; repository certification remains blocking.' \
              | tee "${REPORT_DIR}/github-review-${LOCK_TAG}.txt"
            exit 0
          fi
          assurance_mode="$(
            python -m constructionsight.assurance_certification mode \
              --review-artifact "${review_artifact}"
          )"
          if [ "${assurance_mode}" != 'independent_human' ]; then
            printf '%s\n' \
              "Assurance mode ${assurance_mode} makes no independent-human claim; GitHub human revalidation is not applicable." \
              | tee "${REPORT_DIR}/github-review-${LOCK_TAG}.txt"
            exit 0
          fi
          review_id="$(
            python -m constructionsight.github_review_certification review-id \
              --review-artifact "${review_artifact}"
          )"
          pr_number="$(
            python -m constructionsight.assurance_certification pull-request-number \
              --review-artifact "${review_artifact}"
          )"
          export review_id pr_number
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          root = os.environ["GITHUB_API_ROOT"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["pr_number"]
          review_id = os.environ["review_id"]
          token = os.environ["GITHUB_TOKEN"]
          lock_tag = os.environ["LOCK_TAG"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "ConstructionSight-Certification",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          sources = {
              "pull-request": f"{root}/repos/{repository}/pulls/{pr_number}",
              "review": f"{root}/repos/{repository}/pulls/{pr_number}/reviews/{review_id}",
          }
          for label, url in sources.items():
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read()
              output = (
                  Path(os.environ["REPORT_DIR"])
                  / f"github-{label}-source-{lock_tag}.json"
              )
              output.write_bytes(body)
          PY
          python -m constructionsight.github_review_certification verify \
            --review-artifact "${review_artifact}" \
            --github-review "${REPORT_DIR}/github-review-source-${LOCK_TAG}.json" \
            --github-pull-request "${REPORT_DIR}/github-pull-request-source-${LOCK_TAG}.json" \
            --repository-owner "${REPOSITORY_OWNER}" \
            --output "${REPORT_DIR}/github-review-certification-${LOCK_TAG}.json" \
            2>&1 | tee "${REPORT_DIR}/github-review-${LOCK_TAG}.txt"

      - name: Verify GitHub Actions quality provenance
        id: github-actions-provenance
        continue-on-error: true
        shell: bash
        env:
          GITHUB_API_ROOT: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LOCK_TAG: ${{ matrix.lock-tag }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          review_artifact='governance/reviews/assurance_review.json'
          if [ ! -f "${review_artifact}" ]; then
            printf '%s\n' \
              'Assurance artifact absent; GitHub Actions provenance revalidation is not yet applicable.' \
              | tee "${REPORT_DIR}/github-actions-provenance-${LOCK_TAG}.txt"
            exit 0
          fi
          source_dir="${REPORT_DIR}/github-actions-source-${LOCK_TAG}"
          mkdir -p "${source_dir}"
          RUN_IDS="$(
            python -m constructionsight.github_actions_certification run-ids \
              --root . \
              --review-artifact "${review_artifact}"
          )"
          export RUN_IDS source_dir
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          api_root = os.environ["GITHUB_API_ROOT"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          source_dir = Path(os.environ["source_dir"])
          run_ids = [value for value in os.environ["RUN_IDS"].splitlines() if value]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "ConstructionSight-Certification",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          for run_id in run_ids:
              sources = {
                  f"run-{run_id}.json": f"{api_root}/repos/{repository}/actions/runs/{run_id}",
                  f"jobs-{run_id}.json": f"{api_root}/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100",
              }
              for filename, url in sources.items():
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read()
                  (source_dir / filename).write_bytes(body)
          PY
          python -m constructionsight.github_actions_certification verify \
            --root . \
            --review-artifact "${review_artifact}" \
            --source-dir "${source_dir}" \
            --repository "${REPOSITORY}" \
            --output "${REPORT_DIR}/github-actions-certification-${LOCK_TAG}.json" \
            2>&1 | tee "${REPORT_DIR}/github-actions-provenance-${LOCK_TAG}.txt"

      - name: Verify authenticated GitHub owner acceptance
        id: github-owner-acceptance
        continue-on-error: true
        shell: bash
        env:
          GITHUB_API_ROOT: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          LOCK_TAG: ${{ matrix.lock-tag }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          review_artifact='governance/reviews/assurance_review.json'
          if [ ! -f "${review_artifact}" ]; then
            printf '%s\n' \
              'Assurance artifact absent; owner acceptance revalidation is not yet applicable.' \
              | tee "${REPORT_DIR}/github-owner-acceptance-${LOCK_TAG}.txt"
            exit 0
          fi
          pr_number="$(
            python -m constructionsight.owner_acceptance_certification pr-number \
              --review-artifact "${review_artifact}"
          )"
          review_id="$(
            python -m constructionsight.owner_acceptance_certification review-id \
              --review-artifact "${review_artifact}"
          )"
          export pr_number review_id
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          root = os.environ["GITHUB_API_ROOT"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["pr_number"]
          review_id = os.environ["review_id"]
          token = os.environ["GITHUB_TOKEN"]
          lock_tag = os.environ["LOCK_TAG"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "ConstructionSight-Certification",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          sources = {
              f"github-owner-pull-request-source-{lock_tag}.json": (
                  f"{root}/repos/{repository}/pulls/{pr_number}"
              ),
              f"github-owner-review-source-{lock_tag}.json": (
                  f"{root}/repos/{repository}/pulls/{pr_number}/reviews/{review_id}"
              ),
          }
          for filename, url in sources.items():
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read()
              (Path(os.environ["REPORT_DIR"]) / filename).write_bytes(body)
          PY
          python -m constructionsight.owner_acceptance_certification verify \
            --review-artifact "${review_artifact}" \
            --github-review "${REPORT_DIR}/github-owner-review-source-${LOCK_TAG}.json" \
            --github-pull-request "${REPORT_DIR}/github-owner-pull-request-source-${LOCK_TAG}.json" \
            --repository-owner "${REPOSITORY_OWNER}" \
            --output "${REPORT_DIR}/github-owner-acceptance-certification-${LOCK_TAG}.json" \
            2>&1 | tee "${REPORT_DIR}/github-owner-acceptance-${LOCK_TAG}.txt"

      - name: Repository and semantic certification audit
        id: repository-certification
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          # Legacy v1 scanner compatibility: python -m constructionsight.repository_certification --root . --require-clean-worktree
          python -m constructionsight.repository_certification_v2 \
            --root . \
            --require-clean-worktree \
            --output "${REPORT_DIR}/repository-certification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/repository-certification-${{ matrix.lock-tag }}.txt"

      - name: Diff hygiene
        id: diff-hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          git diff --check \
            2>&1 | tee "${REPORT_DIR}/diff-hygiene-${{ matrix.lock-tag }}.txt"

      - name: Verify post-gate exact environment identity
        id: post-gate-lock-verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          python -m constructionsight.supply_chain verify-lock \
            --lock "${{ matrix.lock-file }}" \
            --output "${REPORT_DIR}/post-gate-lock-verification-${{ matrix.lock-tag }}.json" \
            2>&1 | tee "${REPORT_DIR}/post-gate-lock-verification-${{ matrix.lock-tag }}.txt"

      - name: Enforce all quality gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            '${{ steps.checkout-identity.outcome }}' \
            '${{ steps.install.outcome }}' \
            '${{ steps.lock-verification.outcome }}' \
            '${{ steps.pip-check.outcome }}' \
            '${{ steps.sbom.outcome }}' \
            '${{ steps.pre-gate-lock-verification.outcome }}' \
            '${{ steps.ruff.outcome }}' \
            '${{ steps.mypy.outcome }}' \
            '${{ steps.compile.outcome }}' \
            '${{ steps.pytest.outcome }}' \
            '${{ steps.mutation-certification.outcome }}' \
            '${{ steps.adapter-audit.outcome }}' \
            '${{ steps.source-audit.outcome }}' \
            '${{ steps.assurance-preflight.outcome }}' \
            '${{ steps.github-review.outcome }}' \
            '${{ steps.github-actions-provenance.outcome }}' \
            '${{ steps.github-owner-acceptance.outcome }}' \
            '${{ steps.repository-certification.outcome }}' \
            '${{ steps.diff-hygiene.outcome }}' \
            '${{ steps.post-gate-lock-verification.outcome }}'
          do
            if [ "${gate}" != 'success' ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo 'One or more mandatory quality gates failed. Inspect retained reports.' >&2
            exit 1
          fi

      - name: Retain certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certification-${{ matrix.lock-tag }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7
