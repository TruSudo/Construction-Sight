name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup-pr114-docs:
    if: github.head_ref == 'agent/add-arcgis-rehearsal-http-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-rehearsal-http-adapter
          fetch-depth: 0

      - name: Collapse duplicate entries
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          bullet = "- Digest-bound official ArcGIS rehearsal plans and an exact-response HTTP adapter with one-request transport semantics and fail-closed redirect, endpoint, media-type, size, JSON, and service-error controls\n"
          while bullet + bullet in readme_text:
              readme_text = readme_text.replace(bullet + bullet, bullet)
          if readme_text.count(bullet) != 1:
              raise SystemExit("README ArcGIS HTTP adapter bullet is not singular")
          readme.write_text(readme_text, encoding="utf-8")

          audit = Path("docs/audits/full_repo_audit_inventory.md")
          audit_text = audit.read_text(encoding="utf-8")
          row = "| County parcel ArcGIS rehearsal HTTP adapter | A digest-bound plan and one-request-per-call HTTPS adapter preserve exact successful bytes, centralize retry evidence in the executor, and reject redirect, endpoint, status, media-type, size, JSON, service-error, page-size, offset, and attempt disagreement. Verification is mocked only; no live county request is claimed. |\n"
          while row + row in audit_text:
              audit_text = audit_text.replace(row + row, row)
          if audit_text.count(row) != 1:
              raise SystemExit("Audit ArcGIS HTTP adapter row is not singular")
          audit.write_text(audit_text, encoding="utf-8")
          PY

      - name: Restore canonical CI and publish cleanup
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f docs/audits/pr114_docs_trigger.txt
          rm -f docs/audits/pr114_cleanup_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean ArcGIS rehearsal HTTP adapter documentation"
          git push origin HEAD:agent/add-arcgis-rehearsal-http-adapter
