name: Repair PR114 style

on:
  push:
    branches:
      - agent/add-arcgis-rehearsal-http-adapter

permissions:
  contents: write

concurrency:
  group: repair-pr114-style
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-rehearsal-http-adapter
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply targeted Ruff repair
        run: |
          python -m ruff format \
            src/constructionsight/parcel_source_bulk_rehearsal_http.py \
            tests/test_parcel_source_bulk_rehearsal_http.py
          python -m ruff check --fix \
            src/constructionsight/parcel_source_bulk_rehearsal_http.py \
            tests/test_parcel_source_bulk_rehearsal_http.py
          python -m ruff check \
            src/constructionsight/parcel_source_bulk_rehearsal_http.py \
            tests/test_parcel_source_bulk_rehearsal_http.py

      - name: Remove temporary workflow and publish repair
        run: |
          rm .github/workflows/repair-pr114-style.yml
          rm docs/audits/pr114_style_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize ArcGIS rehearsal HTTP adapter style"
          git push origin HEAD:agent/add-arcgis-rehearsal-http-adapter
