name: Apply Certification Corrections

on:
  push:
    branches:
      - agent/silent-risk-certification
    paths:
      - scripts/apply_certification_corrections.py
      - .github/workflows/apply-certification-corrections.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/silent-risk-certification
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/py311.lock

      - name: Install exact correction environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r requirements/py311.lock
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-build-isolation \
            -e .

      - name: Apply assertion-bound corrections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_certification_corrections.py
          python -m ruff check src tests scripts --fix
          python -m ruff format src tests scripts
          python -m compileall -q src tests scripts
          git diff --check

      - name: Commit exact correction result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Correction script produced no changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Apply evidence-backed certification corrections'
          git push origin HEAD:agent/silent-risk-certification
