name: Bind PR113 count receipts

on:
  push:
    branches:
      - agent/implement-arcgis-complete-rehearsal-executor

permissions:
  contents: write

concurrency:
  group: bind-pr113-count-receipts
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/implement-arcgis-complete-rehearsal-executor
          fetch-depth: 0

      - name: Bind count envelopes to retained receipts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/constructionsight/parcel_source_bulk_rehearsal.py")
          text = path.read_text(encoding="utf-8")

          old_fields = '''    manifest: ParcelArcGISBulkManifest
    checkpoint_reloaded: bool
    artifact_receipts: tuple[ParcelArcGISBulkArtifactReceipt, ...]
    bulk_run_authorized: bool = False
'''
          new_fields = '''    manifest: ParcelArcGISBulkManifest
    checkpoint_reloaded: bool
    starting_count_response_digest: str
    ending_count_response_digest: str
    artifact_receipts: tuple[ParcelArcGISBulkArtifactReceipt, ...]
    bulk_run_authorized: bool = False
'''
          if text.count(old_fields) != 1:
              raise SystemExit("execution field block did not match exactly once")
          text = text.replace(old_fields, new_fields, 1)

          old_checks = '''        if first.kind != ParcelArcGISBulkArtifactKind.STARTING_COUNT:
            raise ValueError("ArcGIS rehearsal first artifact must be the starting count")
        if last.kind != ParcelArcGISBulkArtifactKind.ENDING_COUNT:
            raise ValueError("ArcGIS rehearsal last artifact must be the ending count")
'''
          new_checks = '''        if first.kind != ParcelArcGISBulkArtifactKind.STARTING_COUNT:
            raise ValueError("ArcGIS rehearsal first artifact must be the starting count")
        if last.kind != ParcelArcGISBulkArtifactKind.ENDING_COUNT:
            raise ValueError("ArcGIS rehearsal last artifact must be the ending count")
        for label, digest in (
            ("starting", self.starting_count_response_digest),
            ("ending", self.ending_count_response_digest),
        ):
            if len(digest) != 64 or any(
                character not in "0123456789abcdef" for character in digest
            ):
                raise ValueError(f"ArcGIS rehearsal {label} count digest is malformed")
        if first.response_digest != self.starting_count_response_digest:
            raise ValueError(
                "ArcGIS rehearsal starting-count artifact does not match its response"
            )
        if last.response_digest != self.ending_count_response_digest:
            raise ValueError(
                "ArcGIS rehearsal ending-count artifact does not match its response"
            )
'''
          if text.count(old_checks) != 1:
              raise SystemExit("execution count receipt checks did not match exactly once")
          text = text.replace(old_checks, new_checks, 1)

          old_return = '''    return ParcelArcGISBulkRehearsalExecution(
        manifest=manifest,
        checkpoint_reloaded=True,
        artifact_receipts=tuple(artifact_receipts),
    )
'''
          new_return = '''    return ParcelArcGISBulkRehearsalExecution(
        manifest=manifest,
        checkpoint_reloaded=True,
        starting_count_response_digest=starting_response.response_digest,
        ending_count_response_digest=ending_response.response_digest,
        artifact_receipts=tuple(artifact_receipts),
    )
'''
          if text.count(old_return) != 1:
              raise SystemExit("execution return block did not match exactly once")
          path.write_text(text.replace(old_return, new_return, 1), encoding="utf-8")
          PY

      - name: Remove temporary machinery and publish patch
        run: |
          rm .github/workflows/bind-pr113-count-receipts.yml
          rm docs/audits/pr113_count_receipt_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind rehearsal count responses to artifact receipts"
          git push origin HEAD:agent/implement-arcgis-complete-rehearsal-executor
