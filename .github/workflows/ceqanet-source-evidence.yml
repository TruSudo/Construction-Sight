name: CEQAnet bounded source evidence collection

on:
  push:
    branches:
      - agent/ceqanet-source-verification
    paths:
      - scripts/collect_ceqanet_source_evidence.py
      - .github/workflows/ceqanet-source-evidence.yml

permissions:
  contents: write

jobs:
  collect-validate-and-remove:
    runs-on: ubuntu-latest

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v6
        with:
          ref: agent/ceqanet-source-verification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect bounded live public evidence
        run: python scripts/collect_ceqanet_source_evidence.py

      - name: Remove temporary live collector
        run: |
          git rm \
            scripts/collect_ceqanet_source_evidence.py \
            .github/workflows/ceqanet-source-evidence.yml

      - name: Commit evidence-only production tree candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/source_verification docs/audits
          git diff --cached --check
          git commit -m "Add bounded CEQAnet source verification evidence"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Final diff hygiene
        run: git diff --check

      - name: Push evidence candidate
        run: git push origin HEAD:agent/ceqanet-source-verification
