name: Apply Alignment Baseline

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/silent-risk-certification'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact draft branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/silent-risk-certification
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/py312.lock

      - name: Install exact supported environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r requirements/py312.lock
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-build-isolation \
            -e .

      - name: Apply duplicate-target corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one target, found {count}")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          recurring = Path("src/constructionsight/ceqanet_recurring_run_cli.py")
          replace_once(
              recurring,
              '    """Authorize and execute one exact foreground recurring-run attempt."""\n\n'
              '    definition = _load_model(definition_path, CeqanetRecurringRunDefinition)\n',
              '    """Authorize and execute one exact foreground recurring-run attempt."""\n\n'
              '    if not execute_live:\n'
              '        typer.echo(\n'
              '            "CEQAnet recurring-run execution blocked: caller confirmation is "\n'
              '            "required in addition to scope-bound authority",\n'
              '            err=True,\n'
              '        )\n'
              '        raise typer.Exit(code=1)\n'
              '    definition = _load_model(definition_path, CeqanetRecurringRunDefinition)\n',
          )

          parcel = Path("src/constructionsight/parcel_source_cli.py")
          replace_once(
              parcel,
              '    """Authorize persistence of one exact verified bundle; never authorize bulk."""\n\n'
              '    try:\n'
              '        bundle = load_arcgis_bounded_proof_bundle(input_path)\n',
              '    """Authorize persistence of one exact verified bundle; never authorize bulk."""\n\n'
              '    if not authorize_persistence:\n'
              '        typer.echo(\n'
              '            "ArcGIS bounded-proof persistence blocked: acquisition-persist-bundle "\n'
              '            "requires --authorize-persistence in addition to scope-bound authority",\n'
              '            err=True,\n'
              '        )\n'
              '        raise typer.Exit(code=1)\n'
              '    try:\n'
              '        bundle = load_arcgis_bounded_proof_bundle(input_path)\n',
          )

          script_path = Path("scripts/apply_alignment_baseline_fixes.py")
          script = script_path.read_text(encoding="utf-8")
          recurring_start = script.index(
              '    replace_once(\n'
              '        "src/constructionsight/ceqanet_recurring_run_cli.py",\n'
          )
          recurring_end = script.index(
              '    replace_once(\n'
              '        "src/constructionsight/operator_services/ceqanet_recurring_run_service.py",\n',
              recurring_start,
          )
          script = script[:recurring_start] + script[recurring_end:]
          parcel_start = script.index(
              '    replace_once(\n'
              '        "src/constructionsight/parcel_source_cli.py",\n'
          )
          parcel_end = script.index(
              '\n\n    # Stale lawful-access assertions',
              parcel_start,
          )
          script = script[:parcel_start] + script[parcel_end:]
          script_path.write_text(script, encoding="utf-8")
          PY

      - name: Apply assertion-bound corrections
        shell: bash
        run: python scripts/apply_alignment_baseline_fixes.py

      - name: Enforce Ruff
        shell: bash
        run: python -m ruff check src tests

      - name: Enforce strict mypy
        shell: bash
        run: python -m mypy src

      - name: Compile corrected tree
        shell: bash
        run: python -m compileall -q src tests scripts

      - name: Run full warning-strict suite
        shell: bash
        run: python -m pytest --strict-config --strict-markers -W error -q

      - name: Exercise focused mutation certification
        shell: bash
        run: |
          python -m constructionsight.mutation_certification \
            --root . \
            --output /tmp/alignment-mutation.json

      - name: Commit exact alignment result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- src tests; then
            echo 'Alignment correction script produced no durable changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Align operator boundaries and executable contracts'
          git push origin HEAD:agent/silent-risk-certification
