name: PR92 hardening applicator

on:
  push:
    branches:
      - agent/ceqanet-recurring-run-governance
    paths:
      - scripts/apply_pr92_hardening.py
      - .github/workflows/pr92-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/ceqanet-recurring-run-governance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply exact-anchor hardening patch
        run: python scripts/apply_pr92_hardening.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit validated patch candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/constructionsight/ceqanet_recurring_run_service.py \
            src/constructionsight/ceqanet_recurring_run_verifier.py \
            tests/test_ceqanet_recurring_run.py \
            tests/test_ceqanet_recurring_run_cli.py
          git diff --cached --check
          git commit -m "Harden CEQAnet recurring-run evidence"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Final diff hygiene
        run: git diff --check

      - name: Push hardened phase branch
        run: git push origin HEAD:agent/ceqanet-recurring-run-governance
