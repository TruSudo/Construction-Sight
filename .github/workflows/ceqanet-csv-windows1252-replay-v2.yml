name: CEQAnet Windows-1252 replay finalization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ceqanet-csv-windows1252-replay.yml
      - .github/workflows/ceqanet-csv-windows1252-replay-v2.yml
      - scripts/apply_ceqanet_windows1252_replay.py
      - scripts/patch_ceqanet_windows1252_runtime.py
      - src/constructionsight/ceqanet_csv_cli.py
      - src/constructionsight/ceqanet_csv_models.py
      - src/constructionsight/ceqanet_csv_service.py
      - src/constructionsight/ceqanet_csv_replay_models.py
      - src/constructionsight/ceqanet_csv_replay_service.py
      - tests/test_ceqanet_csv_windows1252_replay.py

permissions:
  contents: write

concurrency:
  group: ceqanet-windows1252-finalization
  cancel-in-progress: true

jobs:
  finalize-replay-and-remove-tooling:
    if: github.event.pull_request.head.ref == 'agent/fix-ceqanet-windows1252-ruff'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-ceqanet-windows1252-ruff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity before replay
        run: python -m pip check

      - name: Pre-replay Ruff
        run: python -m ruff check src tests

      - name: Pre-replay mypy
        run: python -m mypy src

      - name: Build offline encoding replay
        run: |
          constructionsight-ceqanet-csv replay-execution \
            evidence/source_verification/ceqanet_csv_live_execution_2026-07-12.json \
            --output evidence/source_verification/ceqanet_csv_windows1252_replay_2026-07-12.json \
            --max-retained-rows 1000

      - name: Verify offline encoding replay
        run: |
          constructionsight-ceqanet-csv verify-replay \
            evidence/source_verification/ceqanet_csv_live_execution_2026-07-12.json \
            evidence/source_verification/ceqanet_csv_windows1252_replay_2026-07-12.json \
            --output evidence/source_verification/ceqanet_csv_windows1252_replay_verification_2026-07-12.json

      - name: Finalize evidence and canonical documentation
        run: python scripts/apply_ceqanet_windows1252_replay.py finalize

      - name: Record replay final-tree defect resolution
        run: |
          python - <<'PY'
          from pathlib import Path

          status = Path("docs/architecture/current_implementation_status.md")
          text = status.read_text(encoding="utf-8")
          anchor = (
              "| CS-VIAM-019 | P1 | CEQAnet CSV encoding | The first live CSV proof "
              "returned HTTP 200 but the UTF-8-only parser rejected a source Windows-1252 "
              "byte. | Parsing now prefers strict UTF-8 and falls back explicitly to "
              "Windows-1252; the exact retained body is replayed offline, digest-bound, "
              "independently verified, and tested without another request. |"
          )
          row = (
              "| CS-VIAM-020 | P1 | Replay phase final-tree integrity | PR #100 merged "
              "two write-enabled self-patching workflows and two patch scripts after the "
              "replay runtime landed, leaving CI coupled to a stale feature branch. | "
              "PR #101 removes all four temporary files, expands the committed absence "
              "assertion, restores canonical CI-only validation, and certifies the final "
              "production tree. |"
          )
          if text.count(anchor) != 1:
              raise RuntimeError("expected one CS-VIAM-019 reconciliation anchor")
          status.write_text(text.replace(anchor, anchor + "\n" + row, 1), encoding="utf-8")

          audit = Path("docs/audits/full_repo_audit_inventory.md")
          text = audit.read_text(encoding="utf-8")
          anchor = (
              "| CS-AUDIT-025 | P1 | CEQAnet CSV encoding | The first live CSV proof "
              "returned valid source bytes containing Windows-1252 data that the "
              "UTF-8-only parser rejected. | Strict UTF-8 remains preferred; explicit "
              "Windows-1252 fallback is digest-visible, tested, and used to derive a "
              "separately verified replay from the original retained body without "
              "network access. |"
          )
          row = (
              "| CS-AUDIT-026 | P1 | Replay final-tree integrity | PR #100 left two "
              "write-enabled replay workflows and two patch scripts in the production "
              "tree after their runtime changes had already landed. | PR #101 deletes "
              "all temporary replay machinery, tests complete absence, restores "
              "canonical CI-only validation, and certifies the exact cleaned tree. |"
          )
          if text.count(anchor) != 1:
              raise RuntimeError("expected one CS-AUDIT-025 reconciliation anchor")
          audit.write_text(text.replace(anchor, anchor + "\n" + row, 1), encoding="utf-8")
          PY

      - name: Remove all temporary replay tooling
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/ceqanet-csv-windows1252-replay.yml \
            .github/workflows/ceqanet-csv-windows1252-replay-v2.yml \
            scripts/apply_ceqanet_windows1252_replay.py \
            scripts/patch_ceqanet_windows1252_runtime.py

      - name: Commit reconciled production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize CEQAnet replay evidence"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check

      - name: Push certified repair branch
        run: git push origin HEAD:agent/fix-ceqanet-windows1252-ruff
