name: CI Event Probe

on:
  push:
    branches:
      - agent/silent-risk-certification
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report exact-head event delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="CI event probe reached a GitHub-hosted runner. Exact head: \`${HEAD_SHA}\`. Run: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}. This probe performs no repository checkout and no product execution."
          payload="$(python -c 'import json, os; print(json.dumps({"body": os.environ["BODY"]}))' BODY="${body}")"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/117/comments" \
            -d "${payload}"
