name: PR98 diagnostics
# Trigger after workflow registration.

on:
  push:
    branches:
      - agent/ceqanet-live-csv-proof-v3
    paths:
      - .github/workflows/pr98-diagnostics.yml
      - src/constructionsight/ceqanet_csv_live_models.py
      - src/constructionsight/ceqanet_csv_live_service.py
      - src/constructionsight/ceqanet_csv_cli.py
      - tests/test_ceqanet_csv_live.py

permissions:
  contents: read

jobs:
  ruff-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff JSON
        run: python -m ruff check src tests --output-format=json > /tmp/ruff.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr98-ruff-diagnostics
          path: /tmp/ruff.json
      - name: Enforce Ruff
        run: python -m ruff check src tests
