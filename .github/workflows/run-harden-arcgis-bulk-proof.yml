name: Run ArcGIS bulk proof hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: run-harden-arcgis-bulk-proof
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/harden-arcgis-bulk-rehearsal-proof
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Extract and execute the canonical hardening patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/harden-arcgis-bulk-proof.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          step = lines.index("      - name: Harden structured rehearsal proof contract")
          run_line = next(
              index
              for index in range(step + 1, len(lines))
              if lines[index] == "        run: |"
          )
          end = next(
              index
              for index in range(run_line + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[run_line + 1 : end]
          )

          acquisition_start_marker = (
              "replace_once(\n"
              "    acquisition_test,\n"
              "    '''        build_arcgis_bulk_manifest("
          )
          call_end_marker = "        )''',\n)\n"
          acquisition_start = script.index(acquisition_start_marker)
          acquisition_end = (
              script.index(call_end_marker, acquisition_start)
              + len(call_end_marker)
          )
          acquisition_replacement = "\n".join(
              [
                  "acquisition_text = acquisition_test.read_text(encoding=\"utf-8\")",
                  "failure_start = acquisition_text.index(",
                  "    '    with pytest.raises(ValidationError, match=\"stable start and end count\"):\\n'",
                  ")",
                  "failure_end = acquisition_text.index(",
                  "    '\\n\\n\\ndef _bounded_observations(',",
                  "    failure_start,",
                  ")",
                  "failure_replacement = (",
                  "    '    with pytest.raises(ValidationError, match=\"stable start and end count\"):\\n'",
                  "    '        build_arcgis_bulk_manifest(\\n'",
                  "    '            snapshot,\\n'",
                  "    '            started_at=_OBSERVED_AT,\\n'",
                  "    '            completed_at=_OBSERVED_AT + timedelta(minutes=3),\\n'",
                  "    '            starting_count=6,\\n'",
                  "    '            ending_count=7,\\n'",
                  "    '            rehearsal_evidence=rehearsal_evidence,\\n'",
                  "    '        )'",
                  ")",
                  "acquisition_test.write_text(",
                  "    acquisition_text[:failure_start]",
                  "    + failure_replacement",
                  "    + acquisition_text[failure_end:],",
                  "    encoding=\"utf-8\",",
                  ")",
              ]
          )
          script = (
              script[:acquisition_start]
              + acquisition_replacement
              + "\n"
              + script[acquisition_end:]
          )

          storage_start_marker = (
              "replace_once(\n"
              "    storage_test,\n"
              "    '''    manifest = build_arcgis_bulk_manifest("
          )
          storage_start = script.index(storage_start_marker)
          storage_end = (
              script.index("    )''',\n)\n", storage_start)
              + len("    )''',\n)\n")
          )
          storage_replacement = "\n".join(
              [
                  "storage_text = storage_test.read_text(encoding=\"utf-8\")",
                  "storage_test_start = storage_text.index(",
                  "    'def test_complete_chain_persists_manifest_and_verified_assessment() -> None:'",
                  ")",
                  "storage_manifest_start = storage_text.index(",
                  "    '    manifest = build_arcgis_bulk_manifest(\\n',",
                  "    storage_test_start,",
                  ")",
                  "storage_manifest_end = storage_text.index(",
                  "    '\\n    assessment = build_arcgis_acquisition_assessment(',",
                  "    storage_manifest_start,",
                  ")",
                  "storage_manifest_replacement = (",
                  "    '    manifest = build_arcgis_bulk_manifest(\\n'",
                  "    '        snapshot,\\n'",
                  "    '        started_at=_OBSERVED_AT,\\n'",
                  "    '        completed_at=_OBSERVED_AT + timedelta(minutes=3),\\n'",
                  "    '        starting_count=6,\\n'",
                  "    '        ending_count=6,\\n'",
                  "    '        rehearsal_evidence=_bulk_rehearsal_evidence(snapshot),\\n'",
                  "    '    )\\n'",
                  ")",
                  "storage_test.write_text(",
                  "    storage_text[:storage_manifest_start]",
                  "    + storage_manifest_replacement",
                  "    + storage_text[storage_manifest_end:],",
                  "    encoding=\"utf-8\",",
                  ")",
              ]
          )
          script = (
              script[:storage_start]
              + storage_replacement
              + "\n"
              + script[storage_end:]
          )

          Path("/tmp/harden-arcgis-bulk-proof.sh").write_text(
              script + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          bash /tmp/harden-arcgis-bulk-proof.sh > /tmp/harden-arcgis-bulk-proof.log 2>&1
          status=$?
          set -e
          cat /tmp/harden-arcgis-bulk-proof.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/harden-arcgis-bulk-proof.log docs/audits/arcgis_bulk_proof_hardening_diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/audits/arcgis_bulk_proof_hardening_diagnostic.txt
            git commit -m "Record ArcGIS hardening diagnostic" || true
            git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
            exit "$status"
          fi

      - name: Remove temporary phase machinery and commit candidate
        run: |
          rm .github/workflows/harden-arcgis-bulk-proof.yml
          rm .github/workflows/run-harden-arcgis-bulk-proof.yml
          rm docs/audits/arcgis_bulk_proof_hardening_trigger.txt
          rm -f docs/audits/arcgis_bulk_proof_hardening_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden ArcGIS bulk rehearsal evidence"

      - name: Validate exact committed candidate
        run: |
          python -m pip check
          python -m ruff check src tests
          python -m mypy src
          python -m compileall -q src tests
          python -m pytest --strict-config --strict-markers -ra -W error
          constructionsight audit-adapters
          constructionsight audit-source-coverage data/source_registry.seed.json
          python -m constructionsight.repository_certification --root . --require-clean-worktree
          git diff --check

      - name: Push validated candidate
        run: git push origin HEAD:agent/harden-arcgis-bulk-rehearsal-proof
