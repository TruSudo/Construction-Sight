name: CEQAnet bounded live CSV proof

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/record_ceqanet_live_csv_proof.py
      - .github/workflows/ceqanet-live-csv-proof.yml
      - tests/test_ceqanet_csv_live_evidence.py

permissions:
  contents: write

jobs:
  execute-record-validate-remove:
    runs-on: ubuntu-latest

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v6
        with:
          ref: agent/ceqanet-live-csv-evidence-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity before proof
        run: python -m pip check

      - name: Execute exactly one project CSV proof
        run: |
          mkdir -p evidence/source_verification
          set +e
          constructionsight-ceqanet-csv execute-live \
            --sch-number 2026030377 \
            --output evidence/source_verification/ceqanet_csv_live_execution_2026-07-12.json \
            --execute-live \
            --timeout-seconds 20 \
            --max-body-bytes 10000000 \
            --max-retained-rows 1000
          EXECUTION_STATUS=$?
          constructionsight-ceqanet-csv verify-execution \
            evidence/source_verification/ceqanet_csv_live_execution_2026-07-12.json \
            --output evidence/source_verification/ceqanet_csv_live_verification_2026-07-12.json
          VERIFICATION_STATUS=$?
          set -e
          echo "execution_exit_status=${EXECUTION_STATUS}"
          echo "verification_exit_status=${VERIFICATION_STATUS}"
          test -s evidence/source_verification/ceqanet_csv_live_execution_2026-07-12.json
          test -s evidence/source_verification/ceqanet_csv_live_verification_2026-07-12.json

      - name: Record and reconcile actual proof outcome
        run: python scripts/record_ceqanet_live_csv_proof.py

      - name: Remove temporary live-proof tooling
        run: |
          git rm -f \
            .github/workflows/ceqanet-live-csv-proof.yml \
            scripts/record_ceqanet_live_csv_proof.py

      - name: Commit evidence-only production candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record bounded CEQAnet live CSV proof"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Diff hygiene
        run: git diff --check

      - name: Push evidence candidate
        run: git push origin HEAD:agent/ceqanet-live-csv-evidence-v4
