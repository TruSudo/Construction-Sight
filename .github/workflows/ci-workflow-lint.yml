name: CI Workflow Lint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - agent/silent-risk-certification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ConstructionSight
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out actionlint source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rhysd/actionlint
          ref: 011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7
          path: .tools/actionlint
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: false

      - name: Validate canonical CI workflow
        id: actionlint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go run ./.tools/actionlint/cmd/actionlint .github/workflows/ci.yml \
            > actionlint.txt 2>&1

      - name: Retain actionlint diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-ci-actionlint
          path: actionlint.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce actionlint result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat actionlint.txt
          test '${{ steps.actionlint.outcome }}' = 'success'
