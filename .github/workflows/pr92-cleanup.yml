name: PR92 temporary tooling cleanup

on:
  push:
    branches:
      - agent/ceqanet-recurring-run-governance
    paths:
      - .github/workflows/pr92-cleanup.yml

permissions:
  contents: write

jobs:
  remove-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/ceqanet-recurring-run-governance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Remove temporary publishing tooling
        run: |
          git rm \
            scripts/apply_pr92_hardening.py \
            .github/workflows/pr92-hardening.yml \
            .github/workflows/pr92-cleanup.yml

      - name: Commit final production tree candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Remove temporary PR92 publishing tooling"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest --strict-config --strict-markers -ra -W error

      - name: Adapter contract audit
        run: constructionsight audit-adapters

      - name: Source adapter coverage audit
        run: constructionsight audit-source-coverage data/source_registry.seed.json

      - name: Repository certification audit
        run: python -m constructionsight.repository_certification --root . --require-clean-worktree

      - name: Final diff hygiene
        run: git diff --check

      - name: Push final production tree candidate
        run: git push origin HEAD:agent/ceqanet-recurring-run-governance
