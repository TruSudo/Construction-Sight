name: Command Center visual comparison
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/command-center-visual.yml'
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/command-center-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install visual test dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm --prefix tests/visual ci
          cd tests/visual
          npx playwright install --with-deps chromium
      - name: Challenge recorded perceptual calibration
        run: python tests/visual/calibrate.py tests/visual/output/calibration
      - name: Capture offline Demo at current reference viewport
        run: |
          PYTHONPATH=src python -m constructionsight.live_command_center --demo --mockup-parity --no-browser > /tmp/command-center.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 0.2
          done
          mkdir -p tests/visual/output
          node tests/visual/capture.js http://127.0.0.1:8765 tests/visual/output/actual.png
      - name: Structure and fonts with retained genuine source data
        if: always()
        run: |
          PYTHONPATH=src python tests/ui/server.py --real-fixture --data-dir /tmp/cs-real-state --port 8767 > /tmp/cs-real.log 2>&1 &
          mkdir -p tests/visual/output/real
          node tests/visual/capture.js http://127.0.0.1:8767 tests/visual/output/real/actual.png
      - name: Start isolated writable Demo for functional checks
        if: always()
        run: |
          PYTHONPATH=src python tests/ui/server.py --data-dir /tmp/cs-ui-state --port 8766 > /tmp/cs-ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 0.2
          done
      - name: USGS basemap projection and offline failure recovery
        if: always()
        run: node tests/ui/usgs_map.js http://127.0.0.1:8766
      - name: Persistence and lead-to-royalty journey
        if: always()
        run: node tests/ui/state_browser.js http://127.0.0.1:8766 tests/visual/output/state-functions.json
      - name: Delayed workspace response regression
        if: always()
        run: node tests/ui/workspace_race.js http://127.0.0.1:8766
      - name: Versioned scope and price editing
        if: always()
        run: node tests/ui/catalog.js http://127.0.0.1:8766
      - name: Reviewed calibration changes
        if: always()
        run: node tests/ui/calibration.js http://127.0.0.1:8766
      - name: Keyboard site verification with explicit evidence
        if: always()
        run: node tests/ui/verification.js http://127.0.0.1:8766
      - name: Backup, restore and relocation through user menu
        if: always()
        run: |
          PYTHONPATH=src python tests/ui/server.py --data-dir /tmp/cs-folder-state --port 8769 > /tmp/cs-folder.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8769/ > /dev/null; then break; fi
            sleep 0.2
          done
          node tests/ui/data_folder.js http://127.0.0.1:8769
      - name: Local OSM PMTiles and SVG shields
        if: always()
        run: |
          PYTHONPATH=src python tests/ui/server.py --local-map-fixture --data-dir /tmp/cs-map-state --port 8770 > /tmp/cs-map.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8770/ > /dev/null; then break; fi
            sleep 0.2
          done
          node tests/ui/offline_map.js http://127.0.0.1:8770 /tmp/cs-map-state/basemap.pmtiles
      - name: Daily schedule integration in isolated Demo
        if: always()
        run: |
          PYTHONPATH=src python tests/ui/server.py --schedule-fixture --data-dir /tmp/cs-schedule-state --port 8771 > /tmp/cs-schedule.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8771/ > /dev/null; then break; fi
            sleep 0.2
          done
          node tests/ui/schedule.js http://127.0.0.1:8771
      - name: Start separate fixture for inventory actions
        if: always()
        run: |
          PYTHONPATH=src python tests/ui/server.py --data-dir /tmp/cs-click-state --port 8768 > /tmp/cs-click.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8768/ > /dev/null; then break; fi
            sleep 0.2
          done
      - name: Functional actions and all 33 complete contracts
        if: always()
        run: node tests/ui/click_through.js http://127.0.0.1:8768 tests/visual/output/functions.json
      - name: Report pixel ratchet; block on structure and bundled fonts
        if: always()
        run: >-
          python tests/visual/compare_mockup.py
          tests/visual/reference_native_1672x941.png
          tests/visual/output/actual.png tests/visual/output --report-only
      - name: Publish per-region table
        if: always()
        run: |
          cat tests/visual/output/calibration/calibration.md >> "$GITHUB_STEP_SUMMARY"
          cat tests/visual/output/regions.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save screenshot and diff even when comparison fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: command-center-visual-diff
          path: tests/visual/output/

  usgs-live:
    name: Live USGS imagery and navigation probe (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install bounded browser probe
        run: |
          python -m pip install -e '.[dev]'
          npm --prefix tests/visual ci
          cd tests/visual
          npx playwright install --with-deps chromium
      - name: Start retained genuine SMARTS fixture
        run: |
          PYTHONPATH=src python tests/ui/server.py --real-fixture --data-dir /tmp/cs-usgs-real --port 8774 > /tmp/cs-usgs-real.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8774/ > /dev/null; then break; fi
            sleep 0.2
          done
      - name: Load real official USGS imagery and pan/zoom over genuine source markers
        id: probe
        continue-on-error: true
        run: node tests/ui/usgs_live.js http://127.0.0.1:8774 tests/visual/output/usgs-live/report.json
      - name: Report external-provider result without disguising outages
        if: always()
        run: |
          echo "### Live USGS HTTP/image browser probe" >> "$GITHUB_STEP_SUMMARY"
          echo "Probe result: ${{ steps.probe.outcome }} (observational, not a code-quality gate)." >> "$GITHUB_STEP_SUMMARY"
          if [ -f tests/visual/output/usgs-live/report.json ]; then
            echo 'Detailed JSON, timestamps, tile successes, and screenshots are in the usgs-live-probe artifact.' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; p=json.load(open("tests/visual/output/usgs-live/report.json")); print("Live imagery PASS" if p["passed"] else "Live imagery NOT VERIFIED; see artifact for provider errors"); [print(x["service"], "PASS" if x["passed"] else "FAIL", x.get("loaded_tiles",0), "loaded tiles", x.get("error","")) for x in p["providers"]]' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live probe did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain proof of actual live USGS imagery / failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: usgs-live-probe
          path: tests/visual/output/usgs-live/
