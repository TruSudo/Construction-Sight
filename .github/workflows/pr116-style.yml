name: Normalize PR116 style

on:
  push:
    branches:
      - agent/add-arcgis-live-rehearsal-authorization

permissions:
  contents: write

concurrency:
  group: normalize-pr116-style
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/add-arcgis-live-rehearsal-authorization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and autofix new authorization files
        run: |
          python -m ruff format \
            src/constructionsight/parcel_source_bulk_rehearsal_authorization.py \
            src/constructionsight/parcel_source_bulk_rehearsal_authorization_models.py \
            tests/test_parcel_source_bulk_rehearsal_authorization.py
          python -m ruff check --fix \
            src/constructionsight/parcel_source_bulk_rehearsal_authorization.py \
            src/constructionsight/parcel_source_bulk_rehearsal_authorization_models.py \
            tests/test_parcel_source_bulk_rehearsal_authorization.py || true
          python -m ruff check \
            src/constructionsight/parcel_source_bulk_rehearsal_authorization.py \
            src/constructionsight/parcel_source_bulk_rehearsal_authorization_models.py \
            tests/test_parcel_source_bulk_rehearsal_authorization.py

      - name: Remove temporary machinery and publish normalization
        run: |
          rm -f .github/workflows/pr116-style.yml
          rm -f docs/audits/pr116_style_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize ArcGIS rehearsal authorization style"
          git push origin HEAD:agent/add-arcgis-live-rehearsal-authorization
