              ")\n"
              "from constructionsight.parcel_source_verification import (\n",
          )
          replace_block(
              acquisition,
              "def build_arcgis_bulk_manifest(\n",
              "def build_arcgis_acquisition_assessment(\n",
              '''def build_arcgis_bulk_manifest(
    snapshot: ParcelArcGISCapabilitySnapshot,
