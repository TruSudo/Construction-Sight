              "        payload = self.model_dump(mode=\"json\", exclude={\"manifest_id\"})\n",
              1,
          )
          if "rehearsal_evidence: ParcelArcGISBulkRehearsalEvidence" not in manifest_block:
              raise SystemExit("failed to add structured rehearsal evidence to manifest")
          models.write_text(
              models_text[:manifest_start] + manifest_block + models_text[manifest_end:],
